name: Tightbeam platform setup
description: Install the pinned toolchains and dependencies for one Tightbeam source tree.

inputs:
  source_directory:
    description: Source tree relative to GITHUB_WORKSPACE
    required: true
  platform:
    description: Tightbeam platform name
    required: true
  phase:
    description: One of toolchains, cargo-cache, or mix-dependencies
    required: true
  use_cache:
    description: The literal string true or false
    required: true

runs:
  using: composite
  steps:
    - name: Validate setup phase and cache selector
      shell: bash
      env:
        SETUP_PHASE: ${{ inputs.phase }}
        USE_CACHE: ${{ inputs.use_cache }}
      run: |
        set -euo pipefail
        case "$SETUP_PHASE" in
          toolchains|cargo-cache|mix-dependencies) ;;
          *)
            echo "platform setup: phase must be toolchains, cargo-cache, or mix-dependencies; got '$SETUP_PHASE'" >&2
            exit 1
            ;;
        esac
        case "$USE_CACHE" in
          true|false) ;;
          *)
            echo "platform setup: use_cache must be the literal string 'true' or 'false'; got '$USE_CACHE'" >&2
            exit 1
            ;;
        esac

    - name: Install BEAM (pinned, every platform)
      if: ${{ inputs.phase == 'toolchains' }}
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
      with:
        otp-version: "28"
        elixir-version: "1.19.5"

    - name: Install Rust (stable)
      if: ${{ inputs.phase == 'toolchains' }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

    - name: Cache cargo registry
      if: ${{ inputs.phase == 'cargo-cache' && inputs.use_cache == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cargo/registry
        key: cargo-registry-${{ inputs.platform }}-${{ hashFiles(format('{0}/cli/Cargo.lock', inputs.source_directory)) }}

    - name: Cache mix deps
      if: ${{ inputs.phase == 'mix-dependencies' && inputs.use_cache == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ${{ inputs.source_directory }}/deps
          ${{ inputs.source_directory }}/_build
        key: mix-${{ inputs.platform }}-${{ hashFiles(format('{0}/mix.lock', inputs.source_directory)) }}

    - name: mix deps.get
      if: ${{ inputs.phase == 'mix-dependencies' }}
      shell: bash
      working-directory: ${{ inputs.source_directory }}
      run: mix deps.get
