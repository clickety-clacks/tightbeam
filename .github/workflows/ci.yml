# The gate for a successful compile and test is EVERY supported platform, not one.
# This suite ran macOS-only for the project's whole life; the first linux run
# (2026-07-27, shrdlu) showed 90 failures the mac suite never saw. Both jobs
# below are the same gates in the same order — a difference in outcome between
# them is a platform-parity defect by definition, not an environment quirk.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ONE pinned BEAM for every platform. erlef/setup-beam does support macOS
      # runners (OTP 25-29 on macOS-14/15/26) — the earlier "linux and windows
      # only" reading was wrong, and brew cost us the parity the matrix exists
      # to measure: brew shipped Elixir 1.20.2/OTP 29 against linux's pinned
      # 1.19.5/OTP 28, and the two jobs then disagreed about what the SUITE IS
      # (945 tests / 11 skipped on macOS vs 950 / 12 on linux, run 30250495002).
      # A version difference cannot be told apart from a platform difference, so
      # both jobs run the versions development and the hosts run.
      - name: Install BEAM (pinned, every platform)
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - uses: dtolnay/rust-toolchain@stable

      - name: Toolchain versions (the parity record)
        run: |
          elixir --version
          rustc --version

      # The suite is not hermetic: gateway boot refuses unless at least one
      # registered harness CLI probes on PATH, and cli_integration + the rail
      # tests exec the RELEASE tightbeam binary. On dev machines both are
      # satisfied by the developer's environment, which is how a macOS-only
      # dependency on installed harnesses went unnoticed. CI satisfies them
      # explicitly, pinned to the versions the hosts run.
      - name: Install harness CLIs (suite prerequisite)
        run: npm install -g @anthropic-ai/claude-code@2.1.220 @openai/codex@0.145.0

      # The third undeclared dependency, and the one that lied loudest: the
      # identity suite commits and MERGES in a real git repo, and git refuses to
      # write a commit without a committer. `Identity.relearn!/1` runs its merge
      # with no author env, so on a host with no git identity the merge fails for
      # a reason that is not a conflict and relearn reports `{:conflict, []}` —
      # a phantom conflict with nothing to resolve. Every dev mac has a global
      # identity; shrdlu and the runners have none, which is the whole 2-failure
      # IdentityTest delta. Declared here so the suite reads the same everywhere.
      - name: Declare a git identity (suite prerequisite)
        run: |
          git config --global user.name "tightbeam ci"
          git config --global user.email "ci@tightbeam.invalid"

      - name: cargo build --release (suite prerequisite)
        working-directory: cli
        run: cargo build --release

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.name }}-${{ hashFiles('mix.lock') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            cli/target
          key: cargo-${{ matrix.name }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: mix deps.get
        run: mix deps.get

      - name: mix compile
        run: mix compile

      - name: mix format --check-formatted
        run: mix format --check-formatted

      - name: mix test
        run: mix test

      - name: cargo fmt --check
        working-directory: cli
        run: cargo fmt --check

      - name: cargo test
        working-directory: cli
        run: cargo test
