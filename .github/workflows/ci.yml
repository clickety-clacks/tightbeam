# The gate for a successful compile and test is EVERY supported platform, not one.
# This suite ran macOS-only for the project's whole life; the first correctly
# provisioned linux run (2026-07-27, shrdlu) showed 44 failures the mac suite
# never saw. Both jobs below run the same gates in the same order, on the same
# pinned BEAM, against the same declared environment — so a difference in outcome
# between them is a platform-parity defect by definition, and nothing else.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The canonical action preserves the order and behavior documented above.
      # Normal CI owns caches; manual candidate runs call the same gate with caches off.
      - name: Authoritative platform gate
        uses: ./.github/actions/platform-gate
        with:
          source_directory: .
          platform: ${{ matrix.name }}
          use_cache: 'true'

  # THE DEPLOY ARTIFACT IS BUILT HERE, from the pushed SHA, by a machine nobody
  # develops or smoke-tests on. Building it from a dev tree conflates "what I
  # have" with "what was reviewed"; building it on the smoke host conflates the
  # gate with the artifact (caught by Flynn, 2026-08-04: "you're bundling up a
  # deploy from a smoke test?!"). The runners are exactly the two supported
  # platforms — ubuntu x86_64 and macOS arm64 — so `assemble.sh`'s refusal of
  # anything else composes with this matrix rather than fighting it.
  #
  # Gated on the test matrix: an artifact never exists for a SHA the suite did
  # not pass on that platform.
  release:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: darwin-aarch64
    name: release ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A tagged release must prove that its commit is the canonical main tip.
          # The full history exposes origin/main for the exact-tip check below.
          fetch-depth: 0

      - name: Validate the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "release: tag must be exactly v<major>.<minor>.<patch>" >&2
            exit 1
          }
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' cli/Cargo.toml)
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "release: tag $GITHUB_REF_NAME does not match cli/Cargo.toml version $version" >&2
            exit 1
          }
          main_sha=$(git rev-parse 'origin/main^{commit}')
          [ "$GITHUB_SHA" = "$main_sha" ] || {
            echo "release: tagged commit $GITHUB_SHA is not the origin/main tip $main_sha" >&2
            exit 1
          }

      - name: Install BEAM (pinned, same as the gate)
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ matrix.name }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: mix deps.get
        run: mix deps.get

      - name: Assemble the npm package
        run: sh packaging/assemble.sh

      - name: Stamp provenance
        run: |
          cd _build/npm
          for f in tightbeam-*.tgz; do
            mv "$f" "${f%.tgz}-${GITHUB_SHA::7}.tgz"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: tightbeam-${{ matrix.name }}
          path: _build/npm/tightbeam-*.tgz
          retention-days: 90
          if-no-files-found: error

  # A version tag is the release boundary. The two packages above were built
  # from that exact tagged SHA only after the unchanged cross-platform test
  # matrix passed. This job gathers those packages into one named GitHub Release
  # and publishes the checksums and source provenance beside them.
  publish-release:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tightbeam-*
          path: release
          merge-multiple: true

      - name: Verify the release set and write provenance
        run: |
          version=${GITHUB_REF_NAME#v}
          short_sha=${GITHUB_SHA::7}
          darwin="tightbeam-$version-darwin-aarch64-$short_sha.tgz"
          linux="tightbeam-$version-linux-x86_64-$short_sha.tgz"

          [ -f "release/$darwin" ] || {
            echo "release: missing $darwin" >&2
            exit 1
          }
          [ -f "release/$linux" ] || {
            echo "release: missing $linux" >&2
            exit 1
          }
          [ "$(find release -maxdepth 1 -type f -name 'tightbeam-*.tgz' | wc -l)" -eq 2 ] || {
            echo "release: expected exactly the macOS and Linux packages" >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          }

          cd release
          sha256sum "$darwin" "$linux" > SHA256SUMS
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg darwin "$darwin" \
            --arg linux "$linux" \
            '{repository: $repository, tag: $tag, commit: $commit, workflow: $workflow, assets: [$darwin, $linux], checksums: "SHA256SUMS"}' \
            > release-provenance.json

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Tightbeam ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/tightbeam-*.tgz
            release/SHA256SUMS
            release/release-provenance.json
