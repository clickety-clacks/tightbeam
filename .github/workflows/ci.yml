# The gate for a successful compile and test is EVERY supported platform, not one.
# This suite ran macOS-only for the project's whole life; the first linux run
# (2026-07-27, shrdlu) showed 90 failures the mac suite never saw. Both jobs
# below are the same gates in the same order — a difference in outcome between
# them is a platform-parity defect by definition, not an environment quirk.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # erlef/setup-beam does not support macOS runners; brew supplies the BEAM
      # there. The linux side pins the exact versions development runs.
      - name: Install BEAM (linux)
        if: matrix.name == 'linux'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - name: Install BEAM (macos)
        if: matrix.name == 'macos'
        run: |
          brew install elixir
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - name: Toolchain versions (the parity record)
        run: |
          elixir --version
          rustc --version

      # The suite is not hermetic: gateway boot refuses unless at least one
      # registered harness CLI probes on PATH, and cli_integration + the rail
      # tests exec the RELEASE tightbeam binary. On dev machines both are
      # satisfied by the developer's environment, which is how a macOS-only
      # dependency on installed harnesses went unnoticed. CI satisfies them
      # explicitly, pinned to the versions the hosts run.
      - name: Install harness CLIs (suite prerequisite)
        run: npm install -g @anthropic-ai/claude-code@2.1.220 @openai/codex@0.145.0

      - name: cargo build --release (suite prerequisite)
        working-directory: cli
        run: cargo build --release

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.name }}-${{ hashFiles('mix.lock') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            cli/target
          key: cargo-${{ matrix.name }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: mix deps.get
        run: mix deps.get

      - name: mix compile
        run: mix compile

      - name: mix format --check-formatted
        run: mix format --check-formatted

      # The suite's real-binary tests — rail-exec enforcement among them — skip themselves
      # when this is absent, which would leave the containment proof unrun on both jobs.
      - name: cargo build --release
        working-directory: cli
        run: cargo build --release

      - name: mix test
        run: mix test

      - name: cargo fmt --check
        working-directory: cli
        run: cargo fmt --check

      - name: cargo test
        working-directory: cli
        run: cargo test
