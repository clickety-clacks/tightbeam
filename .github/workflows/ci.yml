# The gate for a successful compile and test is EVERY supported platform, not one.
# This suite ran macOS-only for the project's whole life; the first correctly
# provisioned linux run (2026-07-27, shrdlu) showed 44 failures the mac suite
# never saw. Both jobs below run the same gates in the same order, on the same
# pinned BEAM, against the same declared environment — so a difference in outcome
# between them is a platform-parity defect by definition, and nothing else.
name: ci

on:
  push:
    branches: ["0.1.*"]
    tags: ["v*.*.*"]
  pull_request:
  # The merge queue tests each group head, the tip about to exist, under the
  # same linux and macos check names. It never packages or publishes.
  merge_group:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-hex candidate commit to verify; no release publication"
        required: true
        type: string
      docs_validation:
        description: "Run only the hosted docs package/privacy/52-view validation"
        required: false
        default: "off"
        type: choice
        options: ["off", "on"]
      candidate_tree:
        description: "Exact 40-hex tree required when docs_validation is on"
        required: false
        type: string

permissions:
  contents: read

env:
  CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name != 'workflow_dispatch' && github.sha || inputs.candidate_sha }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.docs_validation != 'on'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Changes land on the fast checks: pull requests, the merge queue and
    # branch pushes run source checks, the gate scripts, and a compile (which
    # builds the Rust NIF, so the Rust toolchain stays). The 0.1.9+2857
    # maintenance tag runs its directly affected Mix cases below. Full Mix and
    # Cargo suites remain enabled on manual runs and every other version tag.
    env:
      TARGETED_GUARD_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.1.9+2857' }}
      FULL_SUITE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.1.9+2857') }}
    steps:
      - name: Validate exact source SHA
        shell: bash
        run: |
          [[ "$CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          # The public-rule compatibility gate scans every rule-fact revision
          # since its ratified baseline and refuses incomplete history.
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"

      - name: Verify exact-candidate CI contract
        run: python3 test/exact_head_ci_test.py

      - name: Shipped assets contain no internal identifiers
        run: python3 scripts/verify_shipped_privacy.py

      - name: Public rule facts never shrink
        run: python3 scripts/verify_public_rule_facts.py

      - name: Set setup-beam target for the self-hosted macOS runner
        if: matrix.name == 'macos' && runner.environment == 'self-hosted'
        run: echo "ImageOS=macos26" >> "$GITHUB_ENV"

      - name: Set setup-beam target for the self-hosted Linux runner
        if: matrix.name == 'linux' && runner.environment == 'self-hosted'
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      # ONE pinned BEAM for every platform. erlef/setup-beam does support macOS
      # runners (OTP 25-29 on macOS-14/15/26) — the earlier "linux and windows
      # only" reading was wrong, and brew cost us the parity the matrix exists
      # to measure: brew shipped Elixir 1.20.2/OTP 29 against linux's pinned
      # 1.19.5/OTP 28, and the two jobs then disagreed about what the SUITE IS
      # (945 tests / 11 skipped on macOS vs 950 / 12 on linux, run 30250495002).
      # A version difference cannot be told apart from a platform difference, so
      # both jobs run the versions development and the hosts run.
      - name: Install BEAM (pinned, every platform)
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - uses: dtolnay/rust-toolchain@stable

      - name: Toolchain versions (the parity record)
        if: env.FULL_SUITE == 'true' || env.TARGETED_GUARD_RELEASE == 'true'
        run: |
          elixir --version
          rustc --version

      # Gateway boot refuses unless at least one REGISTERED harness CLI probes on
      # PATH. CI used to satisfy that by npm-installing pinned claude and codex,
      # which is a network dependency, ~40s, and — measured — worth nothing: the
      # suite's failure set is byte-identical with only the in-repo Fixture CLI on
      # PATH (26 failures either way, shrdlu 2026-07-27). CI holds no credentials,
      # so it never drove a real harness turn to begin with; a pinned `--version`
      # cannot catch a harness that changed under us. That is the LIVE
      # feature_smoke matrix's job, and it stays its job.
      #
      # This is not a mock standing in for claude or codex. Fixture is a
      # registered harness in the test registry (config/test.exs) and this is its
      # own CLI: nothing here imitates another harness's behaviour.
      - name: Put the in-repo harness CLI on PATH (suite prerequisite)
        if: env.FULL_SUITE == 'true' || env.TARGETED_GUARD_RELEASE == 'true'
        run: echo "$GITHUB_WORKSPACE/priv/harness_cli" >> "$GITHUB_PATH"

      # The undeclared dependency that lied loudest: the identity suite commits
      # and MERGES in a real git repo, and git refuses to write a commit without a
      # committer. `Identity.relearn!/1` runs its merge with no author env, so on
      # a host with no git identity the merge fails for a reason that is not a
      # conflict and relearn reports `{:conflict, []}` — a phantom conflict with
      # nothing to resolve. Every dev mac has a global identity; shrdlu and the
      # runners have none, which is the whole 2-failure IdentityTest delta.
      - name: Declare a git identity (suite prerequisite)
        if: env.FULL_SUITE == 'true' || env.TARGETED_GUARD_RELEASE == 'true'
        run: |
          git config --global user.name "tightbeam ci"
          git config --global user.email "ci@tightbeam.invalid"

      # Cache the dependency DOWNLOADS only — never cli/target. Two reasons, both
      # learned the hard way (2026-07-27): (1) this step used to sit AFTER the cargo
      # build below, so its restore OVERWROTE the freshly built binary with a stale
      # cached one, and mix test then ran the stale binary while the diagnostic ran
      # the fresh one — the two disagreed and the failure was un-diagnosable. (2) Even
      # ordered correctly, caching cli/target makes cargo's mtime fingerprinting skip
      # the rebuild after a restore, so the gate tests a stale binary. The binary MUST
      # be built from the commit under test, every run. ~15s of dep recompile is the
      # price of a gate that tests what was pushed.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ matrix.name }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: cargo build --release (suite prerequisite)
        if: env.FULL_SUITE == 'true' || env.TARGETED_GUARD_RELEASE == 'true'
        working-directory: cli
        run: cargo build --release

      - name: Put the source-built Tightbeam CLI on PATH (suite prerequisite)
        if: env.FULL_SUITE == 'true' || env.TARGETED_GUARD_RELEASE == 'true'
        run: echo "$GITHUB_WORKSPACE/cli/target/release" >> "$GITHUB_PATH"

      # Make the runner's containment environment VISIBLE. Three fleet hosts at one
      # kernel version are not the platform gate; this job is. When a Landlock grant
      # behaves differently here than on the fleet, this prints the OS release, the
      # Landlock ABI, and a right-by-right grant trace for a directory and a device
      # node — so the cause is read from the runner's own output, not guessed from a
      # kernel number. Never fails the job; it only reports.
      - name: Containment environment (diagnostic)
        if: env.FULL_SUITE == 'true' && matrix.name == 'linux'
        run: |
          uname -a
          echo "--- /dev/null as the shell sees it ---"
          ls -la /dev/null
          stat /dev/null
          echo "--- containment probe ---"
          cli/target/release/tightbeam contain-probe

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.name }}-${{ hashFiles('mix.lock') }}

      - name: mix deps.get
        run: mix deps.get

      - name: mix compile
        run: mix compile

      - name: Run directly affected successor and wake checks
        if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.9+2857'
        run: >-
          scripts/verify_mix.sh
          test/late_ruling_handoff_test.exs
          test/row_driven_waits_test.exs:1297
          test/row_driven_waits_test.exs:305
          test/row_driven_waits_test.exs:598
          test/row_driven_waits_test.exs:771
          test/row_driven_waits_test.exs:1028
          test/row_driven_waits_test.exs:1633
          test/row_driven_waits_test.exs:1696
          test/session_reparent_test.exs:638
          test/refix_requires_diagnosis_test.exs:76
          test/verification_papertrail_test.exs:383

      - name: mix test
        if: env.FULL_SUITE == 'true'
        run: scripts/verify_mix.sh

      - name: cargo test
        if: env.FULL_SUITE == 'true'
        working-directory: cli
        run: cargo test

  # THE DEPLOY ARTIFACT IS BUILT HERE, from the pushed SHA, by a machine nobody
  # develops or smoke-tests on. Building it from a dev tree conflates "what I
  # have" with "what was reviewed"; building it on the smoke host conflates the
  # gate with the artifact (caught by Flynn, 2026-08-04: "you're bundling up a
  # deploy from a smoke test?!"). The runners are exactly the two supported
  # platforms — ubuntu x86_64 and macOS arm64 — so `assemble.sh`'s refusal of
  # anything else composes with this matrix rather than fighting it.
  #
  # Gated on the test matrix: an artifact never exists for a SHA the suite did
  # not pass on that platform.
  release:
    needs: test
    if: github.event_name != 'merge_group' && (startsWith(github.ref, 'refs/heads/0.1.') || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: darwin-aarch64
    name: release ${{ matrix.name }}
    runs-on: ${{ matrix.name == 'linux-x86_64' && fromJSON('["self-hosted", "tb-linux"]') || matrix.os }}
    steps:
      - name: Validate exact source SHA
        shell: bash
        run: |
          [[ "$CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          # A tagged 0.1 release must prove that its commit is the highest 0.1.* tip.
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"

      - name: Validate the release tag
        if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/validate_release_tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Record validated release provenance gate
        if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        run: echo "TIGHTBEAM_RELEASE_TAG_VALIDATED=1" >> "$GITHUB_ENV"

      - name: Set setup-beam target for the self-hosted Linux runner
        if: matrix.name == 'linux-x86_64' && runner.environment == 'self-hosted'
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - name: Install BEAM (pinned, same as the gate)
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ matrix.name }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: mix deps.get
        run: mix deps.get

      - name: Assemble the npm package
        run: sh packaging/assemble.sh

      - name: Stamp provenance
        run: |
          cd _build/npm
          for f in tightbeam-*.tgz; do
            mv "$f" "${f%.tgz}-${CI_SOURCE_SHA::7}.tgz"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: tightbeam-${{ matrix.name }}
          path: _build/npm/tightbeam-*.tgz
          retention-days: 90
          if-no-files-found: error

  # A version tag is the release boundary. The two packages above were built
  # from that exact tagged SHA only after the unchanged cross-platform test
  # matrix passed. This job gathers those packages into one named GitHub Release
  # and publishes the checksums and source provenance beside them.
  publish-release:
    needs: release
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, tb-linux]
    permissions:
      contents: write
    steps:
      # Self-hosted runners keep their workspace between runs; start from an
      # empty release directory so an earlier release's packages are never
      # picked up.
      - name: Start from an empty release directory
        run: rm -rf release

      - uses: actions/download-artifact@v4
        with:
          pattern: tightbeam-*
          path: release
          merge-multiple: true

      - name: Verify the release set and write provenance
        run: |
          identity=${GITHUB_REF_NAME#v}
          version=${identity%%+*}
          short_sha=${GITHUB_SHA::7}
          darwin="tightbeam-$version-darwin-aarch64-$short_sha.tgz"
          linux="tightbeam-$version-linux-x86_64-$short_sha.tgz"

          [ -f "release/$darwin" ] || {
            echo "release: missing $darwin" >&2
            exit 1
          }
          [ -f "release/$linux" ] || {
            echo "release: missing $linux" >&2
            exit 1
          }
          [ "$(find release -maxdepth 1 -type f -name 'tightbeam-*.tgz' | wc -l)" -eq 2 ] || {
            echo "release: expected exactly the macOS and Linux packages" >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          }

          cd release
          sha256sum "$darwin" "$linux" > SHA256SUMS
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg darwin "$darwin" \
            --arg linux "$linux" \
            '{repository: $repository, tag: $tag, commit: $commit, workflow: $workflow, assets: [$darwin, $linux], checksums: "SHA256SUMS"}' \
            > release-provenance.json

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Tightbeam ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/tightbeam-*.tgz
            release/SHA256SUMS
            release/release-provenance.json


  docs-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.docs_validation == 'on'
    name: docs validation ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_TREE: ${{ inputs.candidate_tree }}
      DISPATCH_SHA: ${{ github.sha }}
      MIX_ENV: prod
      GIT_AUTHOR_NAME: Offline docs evidence
      GIT_AUTHOR_EMAIL: docs@invalid
      GIT_COMMITTER_NAME: Offline docs evidence
      GIT_COMMITTER_EMAIL: docs@invalid
    steps:
      - name: Validate dispatch subject
        run: |
          [[ "$CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$DISPATCH_SHA" = "$CI_SOURCE_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and reviewed manual
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^)" = 28d217988f2db1beb0300a6115b7f7b7e72c7214
          git diff --exit-code 28d217988f2db1beb0300a6115b7f7b7e72c7214 HEAD -- priv
      - name: Create isolated evidence directory
        id: evidence
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/docs-validation.XXXXXXXX")
          directory=$(cd "$directory" && pwd -P)
          printf 'DOCS_EVIDENCE=%s\n' "$directory" >> "$GITHUB_ENV"
          printf 'path=%s\n' "$directory" >> "$GITHUB_OUTPUT"
          git show -s --format='%H%n%T%n%P' HEAD > "$directory/source.txt"
          cp scripts/docs_composition_52.json "$directory/inventory.json"
          python3 -c 'import hashlib,json,pathlib,sys; print(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sys.argv[1:]},sort_keys=True))' .github/workflows/ci.yml scripts/docs_composition_52.exs scripts/docs_composition_52.json priv/guidance/operating-manual.md > "$directory/input-hashes.json"
      - name: Shipped privacy
        id: privacy
        run: |
          set -euo pipefail
          python3 scripts/verify_shipped_privacy.py 2>&1 | tee "$DOCS_EVIDENCE/privacy.log"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Toolchain and platform evidence
        run: |
          { uname -sm; elixir --version; rustc --version; node --version; } > "$DOCS_EVIDENCE/toolchains.txt"
      - name: Resolve locked build prerequisites
        run: |
          set -euo pipefail
          for name in ${!TIGHTBEAM_@} ${!RELEASE_@}; do unset "$name"; done
          mix deps.get --only prod 2>&1 | tee "$DOCS_EVIDENCE/dependencies.log"
          git diff --exit-code -- mix.lock cli/Cargo.lock
      - name: Assemble exact source package
        id: package
        run: |
          set -euo pipefail
          for name in ${!TIGHTBEAM_@} ${!RELEASE_@}; do unset "$name"; done
          sh packaging/assemble.sh 2>&1 | tee "$DOCS_EVIDENCE/package.log"
          git diff --exit-code -- mix.lock cli/Cargo.lock
          mkdir "$DOCS_EVIDENCE/packages"
          cp _build/npm/tightbeam-*.tgz "$DOCS_EVIDENCE/packages/"
          python3 - <<'PACKAGES'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['DOCS_EVIDENCE'])
          files = sorted((root / 'packages').glob('*.tgz'))
          assert len(files) == 1, 'expected exactly one native package'
          with tarfile.open(files[0], 'r:gz') as archive:
              manuals = [m for m in archive.getmembers() if m.name.endswith('/priv/guidance/operating-manual.md')]
              assert len(manuals) == 1 and manuals[0].isfile(), 'packaged manual inventory'
              manual = archive.extractfile(manuals[0]).read()
              assert hashlib.sha256(manual).hexdigest() == '9327561e174d9cd45e0a2f04d93ea71ab040fb30a30e557f3e69e46be64d7dff', 'packaged manual differs'
          (root / 'package-hashes.json').write_text(json.dumps({p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}))
          PACKAGES
      - name: Compose 52 supported parent and candidate views without starting the app
        id: composition
        run: |
          set -euo pipefail
          for name in ${!TIGHTBEAM_@} ${!RELEASE_@}; do unset "$name"; done
          mix run --no-start scripts/docs_composition_52.exs 2>&1 | tee "$DOCS_EVIDENCE/composition.log"
          test -z "$(git status --porcelain)"
      - name: Record gate outcomes
        if: always() && steps.evidence.outputs.path != ''
        env:
          PRIVACY_OUTCOME: ${{ steps.privacy.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          COMPOSITION_OUTCOME: ${{ steps.composition.outcome }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, pathlib
          keys = ['CI_SOURCE_SHA', 'EXPECTED_TREE', 'DISPATCH_SHA', 'GITHUB_RUN_ID',
                  'GITHUB_RUN_ATTEMPT', 'PRIVACY_OUTCOME', 'PACKAGE_OUTCOME', 'COMPOSITION_OUTCOME']
          receipt = {k: os.environ[k] for k in keys}
          receipt['passed'] = all(receipt[k] == 'success' for k in ['PRIVACY_OUTCOME', 'PACKAGE_OUTCOME', 'COMPOSITION_OUTCOME'])
          pathlib.Path(os.environ['DOCS_EVIDENCE'], 'receipt.json').write_text(json.dumps(receipt, indent=2))
          RECEIPT
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.path != ''
        with:
          name: docs-validation-${{ matrix.os }}-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 14
          if-no-files-found: error
