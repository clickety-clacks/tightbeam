name: release fixture bootstrap
on:
  push:
    branches: [test/release-upgrade-fixtures]
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-proof-583f55c2f35571ce25ae1365706d1c17aba25de4
          path: candidate
          run-id: '45775334713'
          github-token: ${{ github.token }}
      - name: Generate twice from the verified candidate
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libfaketime
          archive=candidate/packages/linux-x86_64/tightbeam-0.1.17-linux-x86_64.tgz
          echo "1ce35cf3a76d53b15bf617c3665000544c0a0396a9340373c5cbac0f158d86f8  $archive" | sha256sum -c
          faketime=$(dpkg -L libfaketime | grep '/libfaketime.so.1$')
          python3 scripts/seed_release_fixture.py "$archive" first/0.1.17+5505.sql --faketime "$faketime"
          python3 scripts/seed_release_fixture.py "$archive" second/0.1.17+5505.sql --faketime "$faketime"
          diff -u first/0.1.17+5505.sql second/0.1.17+5505.sql
      - uses: actions/upload-artifact@v4
        with:
          name: release-fixture
          path: first/0.1.17+5505.sql
