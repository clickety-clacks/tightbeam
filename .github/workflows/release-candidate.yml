name: release candidate

on:
  push:
    branches:
      - "release-candidate/**"
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: "main or an existing release-candidate/* branch"
        required: true
        type: string
      candidate_sha:
        description: "Exact 40-hex branch head"
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: [self-hosted, tb-linux]
    outputs:
      candidate_branch: ${{ steps.candidate.outputs.branch }}
      candidate_ref: ${{ steps.candidate.outputs.ref }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    env:
      CANDIDATE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_branch || github.ref_name }}
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - id: candidate
        name: Verify the exact candidate branch and emit canonical input
        run: |
          printf '%s\n' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "release candidate: candidate SHA must be exact lower-case 40-hex" >&2
            exit 1
          }
          git check-ref-format "refs/heads/$CANDIDATE_BRANCH"
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" ]

          if [ "$CANDIDATE_BRANCH" = main ]; then
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || {
              echo "release candidate: main candidates require manual dispatch" >&2
              exit 1
            }
            [ "$CANDIDATE_SHA" = "$GITHUB_SHA" ] || {
              echo "release candidate: main candidate SHA must match the dispatched main head" >&2
              exit 1
            }
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            base=$(git rev-parse "$CANDIDATE_SHA^")
          else
            printf '%s\n' "$CANDIDATE_BRANCH" | grep -Eq '^release-candidate/[A-Za-z0-9._/-]+$' || {
              echo "release candidate: invalid candidate branch" >&2
              exit 1
            }
            git fetch --no-tags origin \
              "+refs/heads/0.1.*:refs/remotes/origin/0.1.*" \
              "+refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
            [ "$(git rev-parse "refs/remotes/origin/$CANDIDATE_BRANCH")" = "$CANDIDATE_SHA" ]
            protected_ref=$(sh scripts/highest_0_1_branch.sh)
            base=$(git merge-base "$protected_ref" "$CANDIDATE_SHA")
          fi

          features=$(git rev-list --reverse --topo-order "$base..$CANDIDATE_SHA")
          [ -n "$features" ] || {
            echo "release candidate: candidate range is empty" >&2
            exit 1
          }
          # Feature values are exact Git-produced SHAs, so word splitting is intentional.
          # Redirect OUTSIDE the worktree: the shell creates the output file before
          # the script checks for a dirty worktree (RELEASE_TRAIN.md warns exactly this).
          scripts/release_candidate.sh --check "$CANDIDATE_BRANCH" "$base" $features \
            > "$RUNNER_TEMP/candidate-input.json"
          printf 'branch=%s\n' "$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'ref=refs/heads/%s\n' "$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      # This one-day artifact only carries the checked input between jobs. It is not proof.
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-input-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate-input.json
          retention-days: 1
          if-no-files-found: error

  test:
    needs: metadata
    if: needs.metadata.outputs.candidate_branch != 'release-candidate/dd36-darwin-diagnostic-8664'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: darwin-aarch64
    name: test ${{ matrix.platform }}
    # Linux candidate tests run on the self-hosted pool, which carries only
    # release work. The macOS candidate tests run on a hosted arm64 runner, the
    # same macos-latest image pull request CI uses for its macOS suite: the
    # shared self-hosted Macs can be loaded heavily enough by other work that
    # the suite times out. The package and proof jobs below still build and
    # check the shipped archives on the self-hosted pools.
    runs-on: ${{ matrix.platform == 'linux-x86_64' && fromJSON('["self-hosted", "tb-linux"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Public rule facts never shrink
        run: python3 scripts/verify_public_rule_facts.py

      - name: Set setup-beam target for the self-hosted Linux runner
        if: matrix.platform == 'linux-x86_64' && runner.environment == 'self-hosted'
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      # The self-hosted Macs are shared machines. A full suite writes several GB
      # (its own tmp/ tree plus build output); one run on a nearly full disk
      # failed mid-suite with "no space left on device". Stop at once with a
      # plain message instead.
      - name: Require free disk space on the self-hosted macOS runner
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          floor_gib=15
          avail_gib=$(( $(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') / 1048576 ))
          if [ "$avail_gib" -lt "$floor_gib" ]; then
            echo "::error::This runner has ${avail_gib} GiB free; a full macOS suite needs at least ${floor_gib} GiB. Free space on the runner's disk, then re-run."
            exit 1
          fi
          echo "free disk: ${avail_gib} GiB (floor ${floor_gib} GiB)"

      - name: Set setup-beam target for the self-hosted macOS runner
        if: matrix.platform == 'darwin-aarch64' && runner.environment == 'self-hosted'
        run: echo "ImageOS=macos26" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Put the in-repo harness CLI on PATH
        run: echo "$GITHUB_WORKSPACE/priv/harness_cli" >> "$GITHUB_PATH"

      - name: Declare the test Git identity
        run: |
          git config --global user.name "tightbeam ci"
          git config --global user.email "ci@tightbeam.invalid"

      - name: Build the release CLI
        working-directory: cli
        run: cargo build --release

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Prepare bounded Darwin failure evidence
        if: runner.os == 'macOS'
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/dd36-darwin.XXXXXXXX")
          directory=$(cd "$directory" && pwd -P)
          printf 'DD36_DARWIN_DIAGNOSTIC_DIR=%s\n' "$directory" >> "$GITHUB_ENV"
          python3 scripts/collect_darwin_diagnostic.py prepare "$directory" "$CANDIDATE_SHA"

      - name: Run authoritative gates
        id: gates
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            set +e
            scripts/verify_mix.sh > "$DD36_DARWIN_DIAGNOSTIC_DIR/full.log" 2>&1
            status=$?
            printf '%s\n' "$status" > "$DD36_DARWIN_DIAGNOSTIC_DIR/exit.txt"
            cat "$DD36_DARWIN_DIAGNOSTIC_DIR/full.log"
            [ "$status" -eq 0 ] || exit "$status"
            set -e
          else
            scripts/verify_mix.sh
          fi
          (cd cli && cargo test)

      - name: Collect bounded Darwin failure evidence
        if: failure() && runner.os == 'macOS' && steps.gates.outcome == 'failure'
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
        run: python3 scripts/collect_darwin_diagnostic.py collect "$DD36_DARWIN_DIAGNOSTIC_DIR" "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'macOS' && steps.gates.outcome == 'failure'
        with:
          name: darwin-failure-${{ needs.metadata.outputs.candidate_sha }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/runtime.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/vm.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/libraries.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/exit.txt
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/crash.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/full.log

  darwin-diagnostic:
    needs: metadata
    if: needs.metadata.outputs.candidate_branch == 'release-candidate/dd36-darwin-diagnostic-8664'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
      GIT_AUTHOR_NAME: tightbeam ci
      GIT_AUTHOR_EMAIL: ci@tightbeam.invalid
      GIT_COMMITTER_NAME: tightbeam ci
      GIT_COMMITTER_EMAIL: ci@tightbeam.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact diagnostic checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - uses: dtolnay/rust-toolchain@stable
      - name: Put synthetic harness CLI on PATH
        run: echo "$GITHUB_WORKSPACE/priv/harness_cli" >> "$GITHUB_PATH"
      - name: Build existing release CLI prerequisite
        run: cargo build --locked --release --manifest-path cli/Cargo.toml
      - name: Resolve existing locked Mix prerequisites
        run: |
          mix deps.get
          git diff --exit-code -- mix.lock cli/Cargo.lock
      - name: Compile existing source
        run: mix compile
      - name: Prepare isolated diagnostic evidence
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/dd36-darwin.XXXXXXXX")
          directory=$(cd "$directory" && pwd -P)
          printf 'DD36_DARWIN_DIAGNOSTIC_DIR=%s\n' "$directory" >> "$GITHUB_ENV"
          python3 scripts/collect_darwin_diagnostic.py prepare "$directory" "$CANDIDATE_SHA"
      - name: Run only four synthetic diagnostic subjects
        run: |
          set +e
          scripts/verify_mix.sh test/supervision_test.exs:1672 \
            test/live_base_lock_test.exs:62 \
            test/live_base_lock_test.exs:113 \
            test/live_base_lock_test.exs:128 \
            > "$DD36_DARWIN_DIAGNOSTIC_DIR/focused.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$DD36_DARWIN_DIAGNOSTIC_DIR/exit.txt"
          exit "$status"
      - name: Collect only the recorded test VM crash
        if: always() && env.DD36_DARWIN_DIAGNOSTIC_DIR != ''
        run: python3 scripts/collect_darwin_diagnostic.py collect "$DD36_DARWIN_DIAGNOSTIC_DIR" "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@v4
        if: always() && env.DD36_DARWIN_DIAGNOSTIC_DIR != ''
        with:
          name: darwin-diagnostic-${{ needs.metadata.outputs.candidate_sha }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/runtime.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/vm.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/libraries.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/exit.txt
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/crash.json
            ${{ env.DD36_DARWIN_DIAGNOSTIC_DIR }}/focused.log

  package:
    needs: [metadata, test]
    if: needs.metadata.outputs.candidate_branch != 'release-candidate/dd36-darwin-diagnostic-8664' && success()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: darwin-aarch64
    name: package ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux-x86_64' && fromJSON('["self-hosted", "tb-linux"]') || fromJSON('["self-hosted", "tb-macos"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set setup-beam target for the self-hosted Linux runner
        if: matrix.platform == 'linux-x86_64' && runner.environment == 'self-hosted'
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - name: Set setup-beam target for the self-hosted macOS runner
        if: matrix.platform == 'darwin-aarch64' && runner.environment == 'self-hosted'
        run: echo "ImageOS=macos26" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Assemble and stage the native package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sh packaging/assemble.sh
          package=$(find _build/npm -maxdepth 1 -type f -name 'tightbeam-*.tgz')
          [ "$(printf '%s\n' "$package" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1 ]
          if grep -Fq setup-build.json packaging/assemble.sh; then
            sh packaging/verify-setup-build.sh "$package" "$(git rev-parse HEAD)"
          else
            echo "The selected candidate predates setup build identity. Skipped the setup stamp check." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "stage/packages/$PLATFORM" stage/toolchains
          python3 packaging/gateway-smoke.py "$package" > package-smoke.txt
          cat package-smoke.txt
          cp "$package" "stage/packages/$PLATFORM/"
          digest=$(shasum -a 256 "stage/packages/$PLATFORM/$(basename "$package")" | awk '{print $1}')
          grep -F "package smoke: OK sha256=$digest " package-smoke.txt > /dev/null
          {
            elixir --version
            rustc --version
            cat package-smoke.txt
          } > "stage/toolchains/$PLATFORM.txt"

      # Staging is short-lived job transport. Only the proof job publishes candidate proof.
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-staging-${{ needs.metadata.outputs.candidate_sha }}-${{ matrix.platform }}
          path: stage/
          retention-days: 1
          if-no-files-found: error

  proof:
    needs: [metadata, package]
    if: ${{ success() }}
    runs-on: [self-hosted, tb-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: candidate-input-${{ needs.metadata.outputs.candidate_sha }}
          path: evidence

      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-staging-${{ needs.metadata.outputs.candidate_sha }}-*
          path: evidence
          merge-multiple: true

      - name: Create and verify the complete proof manifest
        env:
          CANDIDATE_REF: ${{ needs.metadata.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 scripts/verify_release_candidate_manifest.py create \
            --candidate-input evidence/candidate-input.json \
            --evidence-root evidence \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output evidence/release-candidate-manifest.json
          python3 scripts/verify_release_candidate_manifest.py verify \
            --manifest evidence/release-candidate-manifest.json \
            --evidence-root evidence \
            --repository-root . \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-ref "$CANDIDATE_REF" \
            --expected-source-sha "$CANDIDATE_SHA" \
            --expected-workflow-sha "$WORKFLOW_SHA"
          (
            cd evidence
            find packages toolchains -type f -print | sort | xargs sha256sum
            sha256sum release-candidate-manifest.json
          ) > evidence/SHA256SUMS

      - name: Create the selector-ready staging payload for a main candidate
        if: needs.metadata.outputs.candidate_branch == 'main'
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' cli/Cargo.toml)
          build=$(git rev-list --count "$CANDIDATE_SHA")
          release_tag="v$version+$build"
          sh scripts/validate_release_tag.sh "$release_tag" "$CANDIDATE_SHA" --selected-candidate
          python3 scripts/verify_release_candidate_stage.py create \
            --proof-manifest evidence/release-candidate-manifest.json \
            --evidence-root evidence \
            --stage-root candidate-stage \
            --repository-root . \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$CANDIDATE_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --release-tag "$release_tag" \
            --version "$version"
          (
            cd candidate-stage
            sha256sum --check SHA256SUMS
          )

      - uses: actions/setup-node@v4
        if: needs.metadata.outputs.candidate_branch == 'main'
        with:
          node-version: "24"

      - name: Dry-run the install channel payloads
        if: needs.metadata.outputs.candidate_branch == 'main'
        run: |
          release_tag=$(jq -er .tag candidate-stage/release-provenance.json)
          node packaging/prepare-install-channels.mjs "$release_tag" candidate-stage/SHA256SUMS "$RUNNER_TEMP/install-channels"
          if [ -f packaging/smoke/verify-setup-entrypoints.sh ]; then
            jq -e '.engines.node == ">=24"' "$RUNNER_TEMP/install-channels/npm/package.json" >/dev/null
          fi
          npm pack --dry-run "$RUNNER_TEMP/install-channels/npm"

      # Neither candidate artifact exists unless metadata, both test jobs, and both package jobs passed.
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-proof-${{ needs.metadata.outputs.candidate_sha }}
          path: |
            evidence/release-candidate-manifest.json
            evidence/SHA256SUMS
            evidence/packages/
            evidence/toolchains/
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: needs.metadata.outputs.candidate_branch == 'main'
        with:
          name: release-candidate-stage-${{ needs.metadata.outputs.candidate_sha }}
          path: candidate-stage/
          retention-days: 90
          if-no-files-found: error

  installer-setup:
    needs: [metadata, proof]
    if: needs.metadata.outputs.candidate_branch == 'main'
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}
          persist-credentials: false

      - name: Report legacy candidate verification
        if: ${{ hashFiles('packaging/smoke/verify-setup-entrypoints.sh') == '' }}
        run: echo "The selected candidate predates setup entry-point verification." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('packaging/smoke/verify-setup-entrypoints.sh') != '' }}
        with:
          name: release-candidate-stage-${{ needs.metadata.outputs.candidate_sha }}
          path: candidate-stage

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('packaging/smoke/verify-setup-entrypoints.sh') != '' }}
        with:
          node-version: "24"

      - uses: Homebrew/actions/setup-homebrew@main
        if: ${{ hashFiles('packaging/smoke/verify-setup-entrypoints.sh') != '' }}

      - name: Verify setup through the staged npm and Homebrew commands
        if: ${{ hashFiles('packaging/smoke/verify-setup-entrypoints.sh') != '' }}
        shell: bash
        run: |
          source packaging/smoke/verify-setup-entrypoints.sh
          verify_staged_setup_entrypoints "$PWD/candidate-stage"
