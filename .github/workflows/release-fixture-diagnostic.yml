name: release fixture diagnostic
on:
  push:
    branches: [test/release-fixture-diagnostic]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d9208ed128fd3b50dae3e3329ec3e56960f0b1b
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - uses: dtolnay/rust-toolchain@stable
      - name: Record tested versions
        run: |
          test "$(git rev-parse HEAD)" = 1d9208ed128fd3b50dae3e3329ec3e56960f0b1b
          elixir --version
          rustc --version
          sha256sum test/fixtures/releases/0.1.17+5505.sql
      - name: Prepare startup dependencies
        run: |
          echo "$PWD/priv/harness_cli" >> "$GITHUB_PATH"
          git config --global user.name "Tightbeam CI"
          git config --global user.email "ci@example.invalid"
          cargo build --release --manifest-path cli/Cargo.toml
          echo "$PWD/cli/target/release" >> "$GITHUB_PATH"
          mix deps.get
      - name: Run the interrupted startup scenario
        run: scripts/verify_mix.sh test/release_fixture_upgrade_test.exs test/test_case_test.exs --trace
