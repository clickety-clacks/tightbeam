name: Tour Guide setup evidence
on:
  push:
    branches: [evidence/fresh-tour-installer]
permissions:
  contents: read
jobs:
  fresh:
    strategy:
      fail-fast: false
      matrix:
        scenario: [quick-onboarding, full-onboarding, quick-upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep the test program and check out the exact implementation
        run: |
          cp scripts/setup-{install,model,turn,browser}-evidence.* "$RUNNER_TEMP/"
          git checkout --detach "$(cat scripts/setup-evidence-sha.txt)"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and verify setup
        shell: bash
        env:
          SETUP_SCENARIO: ${{ matrix.scenario }}
        run: bash "$RUNNER_TEMP/setup-install-evidence.sh" 2>&1 | tee "$RUNNER_TEMP/setup-install.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-setup-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/setup-install.log
            ${{ runner.temp }}/browser-evidence.log
            ${{ runner.temp }}/installer-browser-launches.log
            ${{ runner.temp }}/browser-targets.log
            ${{ runner.temp }}/tour-guide.png
            ${{ runner.temp }}/project-exec.png
