[package]
name = "tightbeam"
version = "0.1.7"
edition = "2024"
# edition 2024 needs Rust >= 1.85. Without this field cargo reports the mismatch as
# "feature `edition2024` is required ... not stabilized in this version of Cargo",
# which names a cargo feature rather than the thing to fix. With it, cargo says the
# package requires a newer rustc and prints the version it found. Ubuntu 24.04 LTS
# ships 1.75, so this is the first wall a customer hits.
rust-version = "1.85"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10"
serde_json = "1"
ureq = { version = "2", default-features = true }
