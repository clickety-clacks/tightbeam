[[statute]]
name = "no-git-stash"
on = "tool-call"
mode = "gate"
tool = "Bash"
pattern = "git[[:space:]]+stash([[:space:]]+(push|pop|drop|clear|apply|save)|[[:space:]]*([^[:alnum:][:space:]]|$))"
text = "You ran a mutating git stash; destructive git is forbidden on any worktree because it silently hides another agent's uncommitted work."

[[statute]]
name = "no-git-reset-hard"
on = "tool-call"
mode = "gate"
tool = "Bash"
pattern = "git[[:space:]]+reset[[:space:]]+--hard"
text = "You ran git reset --hard; destructive git is forbidden on any worktree because it discards another agent's uncommitted work."

[[statute]]
name = "no-git-clean-force"
on = "tool-call"
mode = "gate"
tool = "Bash"
pattern = "git[[:space:]]+clean[[:space:]]+(--force|-[^[:space:]]*f)"
text = "You ran a forced git clean; destructive git is forbidden on any worktree because it deletes another agent's untracked work."

[[statute]]
name = "no-git-checkout-discard"
on = "tool-call"
mode = "gate"
tool = "Bash"
pattern = "git[[:space:]]+checkout[[:space:]]+--([[:space:]]|$)"
text = "You ran git checkout -- to discard paths; destructive git is forbidden on any worktree because it overwrites another agent's uncommitted work."

# Known deliberate over-match: also refuses the non-destructive "git restore --staged" (unstage only).
# Kept broad — narrowing safely needs a portable POSIX-class exclusion; accident-grade by design.
[[statute]]
name = "no-git-restore"
on = "tool-call"
mode = "gate"
tool = "Bash"
pattern = "git[[:space:]]+restore"
text = "You ran git restore; destructive git is forbidden on any worktree because it discards another agent's uncommitted work."

# Seed-owned archetypes cannot lawfully elect bundle skills. This global KUNGFU
# gate gives those identities the same retirement stop while leaving the
# substrate and the operator-owned seed manifests untouched. The resolved-path
# form is the deliberate post-proof ceremony; rails are accident-grade, so this
# is a two-step stop, not a claim of adversarial containment.
[[statute]]
name = "preserve-repository-work-before-retire"
on = "tool-call"
mode = "gate"
tool = "Bash"
pattern = "(^|[^/[:alnum:]_-])tightbeam[[:space:]]+retire([[:space:]]|$)"
text = "Direct retirement is blocked until repository bytes have durable custody. Inspect the target's complete workspace, including local commits and tracked, untracked, and ignored files. Push every commit that must survive. If local-only work remains, archive the complete repository outside the target workspace and record the archive on the work item. If you cannot inspect or preserve it, do not retire. After proof, invoke the resolved absolute tightbeam CLI path instead of the bare command."
