# Production staffing is admitted from exact work-item custody and a returned,
# attributable topology verdict. Role names, session ancestry, and a
# generic/default archetype are not authority. Bootstrap, intake, consultation,
# and review remain reachable through their actual archetype/effect context.
[[rule]]
name = "engineering-spawn-staffing-needs-work-item"
verb = "spawn"
text = "Worker staffing requires a known work item. Current accountable owner: {delivery_owner_ref}. Create or link the work item and establish its explicit delivery scope before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "spawn.archetype", op = "not_in", value = ["orchestrator", "product-owner", "pdo"] },
  { fact = "work_item.reference_state", op = "ne", value = "known" },
]

[[rule]]
name = "engineering-spawn-referenced-work-item-must-exist"
verb = "spawn"
text = "A referenced work item must exist before spawning. Current accountable owner: {delivery_owner_ref}. Correct or create the item reference before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.reference_state", op = "eq", value = "unknown" },
]

[[rule]]
name = "engineering-spawn-staffing-needs-delivery-owner"
verb = "spawn"
text = "Worker staffing requires an explicit delivery scope and accountable owner for this exact work item. No accountable delivery owner is recorded. Establish the work item's delivery scope and accountable owner before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.reference_state", op = "eq", value = "known" },
  { fact = "work_item.has_delivery_owner", op = "ne", value = true },
]

[[rule]]
name = "engineering-spawn-staffing-needs-current-delivery-owner"
verb = "spawn"
text = "Worker staffing requires a current accountable delivery owner for this exact work item. The recorded delivery owner is stale or unavailable. The work item's human owner/admin or the owner's actual Main must explicitly recover the delivery scope before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.reference_state", op = "eq", value = "known" },
  { fact = "work_item.has_delivery_owner", op = "eq", value = true },
  { fact = "work_item.delivery_owner_state", op = "not_in", value = ["current"] },
]

[[rule]]
name = "engineering-spawn-staffing-needs-responsibility"
verb = "spawn"
text = "Worker staffing requires accountable or explicitly delegated responsibility for this exact work item. Current accountable owner: {delivery_owner_ref}. Route the request through that owner or obtain an active exact-item delegation before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.reference_state", op = "eq", value = "known" },
  { fact = "caller.delivery_responsibility", op = "not_in", value = ["accountable", "delegated"] },
]

[[rule]]
name = "engineering-spawn-staffing-needs-topology"
verb = "spawn"
text = "Production staffing requires returned attributable topology for this work item. Current accountable owner: {delivery_owner_ref}. Record topology-decided on the item, then have that owner or an active exact-item delegate retry."
edges = ["verb"]
effect = "deny"
external_producer = true
deny_when = [
  { fact = "work_item.reference_state", op = "eq", value = "known" },
  { fact = "caller.delivery_responsibility", op = "in", value = ["accountable", "delegated"] },
  { fact = "work_item.verdict_kinds", op = "not_in", value = ["topology-decided"] },
]

[[rule]]
name = "engineering-assign-staffing-needs-work-item"
verb = "assign"
text = "Engineering staffing requires a known work item. Current accountable owner: {delivery_owner_ref}. Link intake, consultation, review, and production assignments to their durable item before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.reference_state", op = "ne", value = "known" },
]

[[rule]]
name = "engineering-assign-production-needs-current-delivery-owner"
verb = "assign"
text = "Production staffing requires a current accountable delivery owner for this exact work item. The recorded delivery owner is stale or unavailable. The work item's human owner/admin or the owner's actual Main must explicitly recover the delivery scope before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "assign.is_linked_review", op = "ne", value = true },
  { fact = "assign.effect_kind", op = "ne", value = "coordination" },
  { fact = "work_item.has_delivery_owner", op = "eq", value = true },
  { fact = "work_item.delivery_owner_state", op = "not_in", value = ["current"] },
]

[[rule]]
name = "engineering-assign-production-office-target-refused"
verb = "assign"
text = "Production work cannot be assigned to a PO or PDO office session. Current accountable owner: {delivery_owner_ref}. Assign an implementation worker, or use a genuine intake, consultation, or linked-review context."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "assign.is_linked_review", op = "ne", value = true },
  { fact = "assign.effect_kind", op = "ne", value = "coordination" },
  { fact = "target.archetype", op = "in", value = ["product-owner", "pdo"] },
]

