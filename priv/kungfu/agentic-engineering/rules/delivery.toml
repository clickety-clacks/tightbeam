text = "Production work cannot be assigned to the accountable delivery owner. Current accountable owner: {delivery_owner_ref}. Keep that owner accountable and assign an implementation worker instead."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "assign.is_linked_review", op = "ne", value = true },
  { fact = "assign.effect_kind", op = "ne", value = "coordination" },
  { fact = "target.delivery_responsibility", op = "eq", value = "accountable" },
]

