# Engineering production requires an explicit owner and returned topology.
# Core authorization still applies to every caller; coordination and linked
# review retain their existing intake paths.
[[rule]]
name = "engineering-spawn-staffing-needs-work-item"
verb = "spawn"
text = "Worker staffing requires a known work item. Create or link the work item before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "spawn.archetype", op = "not_in", value = ["orchestrator", "product-owner", "pdo"] },
  { fact = "work_item.reference_state", op = "ne", value = "known" },
]

[[rule]]
name = "engineering-spawn-referenced-work-item-must-exist"
verb = "spawn"
text = "Referenced work item {work_item_id} does not exist. Correct the item reference or create the item before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.reference_state", op = "eq", value = "unknown" },
]

[[rule]]
name = "engineering-spawn-staffing-needs-topology"
verb = "spawn"
text = "Production staffing requires returned attributable topology for this work item. Current delivery owner: {delivery_owner_ref}. Record topology-decided on the item, then have that owner or an active exact-item assignment holder retry."
edges = ["verb"]
effect = "deny"
external_producer = true
deny_when = [
  { fact = "work_item.delivery_owner_state", op = "eq", value = "current" },
  { fact = "work_item.verdict_kinds", op = "not_in", value = ["topology-decided"] },
]

[[rule]]
name = "engineering-assign-staffing-needs-work-item"
verb = "assign"
text = "Engineering staffing requires a known work item. Link intake, consultation, review, and production assignments to their durable item before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.reference_state", op = "ne", value = "known" },
]

[[rule]]
name = "engineering-assign-production-needs-delivery-owner"
verb = "assign"
text = "Production staffing of work item {work_item_id} requires a current delivery owner. Set the intended owner explicitly with work-item-update --delivery-owner before retrying."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "assign.is_linked_review", op = "ne", value = true },
  { fact = "assign.effect_kind", op = "ne", value = "coordination" },
  { fact = "work_item.reference_state", op = "eq", value = "known" },
  { fact = "work_item.has_delivery_owner", op = "ne", value = true },
]

[[rule]]
name = "engineering-assign-production-office-target-refused"
verb = "assign"
text = "Production work cannot be assigned to a PO or PDO office session. Assign an implementation worker or use a genuine intake, consultation, or linked-review context."
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "assign.is_linked_review", op = "ne", value = true },
  { fact = "assign.effect_kind", op = "ne", value = "coordination" },
  { fact = "target.archetype", op = "in", value = ["product-owner", "pdo"] },
]

[[rule]]
name = "engineering-assign-production-needs-topology"
verb = "assign"
text = "Production staffing requires returned attributable topology for this work item. Current delivery owner: {delivery_owner_ref}. Record topology-decided on the item, then have that owner or an active exact-item assignment holder retry."
edges = ["verb"]
effect = "deny"
external_producer = true
deny_when = [
  { fact = "assign.is_linked_review", op = "ne", value = true },
  { fact = "assign.effect_kind", op = "ne", value = "coordination" },
  { fact = "work_item.delivery_owner_state", op = "eq", value = "current" },
  { fact = "work_item.verdict_kinds", op = "not_in", value = ["topology-decided"] },
]

