# "Pushing the product forwards is the goal of this kung-fu. No rule shall trump this rule. If there is a clear way forward, and that way forward is safe, then no rule, statute, or rail shall block it. If a rule, statute, or rail blocks this, it is necessarily wrong, and should be reported with a decision-request, but this DOES NOT BLOCK WORK. Get it done, and apologize later."

# Artifact-producing archetypes first leave reviewable evidence. A reviewer must never be
# commissioned for work that has no artifact or exact commit reference to inspect.
[[rule]]
name = "artifact-completion-requires-output"
verb = "attest"
text = "an artifact-producing archetype must record a reviewable artifact or commit reference before completion"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.holder_output_kind", op = "eq", value = "artifact" },
  { fact = "assignment.has_reviewable_artifact", op = "eq", value = false },
]
edges = ["verb"]

# Flagship enforced loop (roadmap P7): artifact-producing archetypes require one independent review.
# A holder attesting qualifying completion without a reviewed-clean verdict is not denied — the
# substrate assigns a reviewer (the remedy), blocks the completion until the review
# lands, and self-releases. This is the reviewer-loop worked example, enforced.
[[rule]]
name = "completion-requires-review"
verb = "attest"
text = "code, policy, release, and live-mutation completion needs exactly one --reviews-linked card held by a different session whose latest holder-filed verdict is reviewed-clean; evidence, review, and coordination effects do not require review, and harness, provider, model, and effort guide reviewer selection only"
external_producer = false
edges = ["verb"]
effect = "remedy"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.holder_output_kind", op = "eq", value = "artifact" },
  { fact = "assignment.qualifying_review_verdict_kinds", op = "not_in", value = ["reviewed-clean"] },
]
[rule.remedy]
action = "assign"
produces = "reviewed-clean"
target_role = "reviewer"
on_rule_denied = "surface"
[rule.remedy.params]
subject = "review of assignment {assignment_id}"
reviews = "{assignment_id}"

[[rule]]
name = "verdict-completion-requires-holder-verdict"
verb = "attest"
text = "a verdict-producing archetype must file its own verdict before completion"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.holder_output_kind", op = "eq", value = "verdict" },
  { fact = "assignment.holder_has_verdict", op = "eq", value = false },
]
edges = ["verb"]

# Re-entry twin of completion-requires-review: after one completed fix on a bug
# work item, the next implementation dispatch first commissions a dedicated
# recon. The recon archetype elects bug-provenance; its diagnosed verdict releases
# the work-item-grain remedy episode and permits the re-fix dispatch.
[[rule]]
name = "refix-requires-diagnosis"
verb = "dispatch"
text = "a repeated bug fix requires a diagnosed verdict on its work item"
external_producer = false
edges = ["verb"]
effect = "remedy"
deny_when = [
  { fact = "work_item.is_bug", op = "eq", value = true },
  { fact = "assignment.prior_completed_fix_count", op = "gte", value = 1 },
  { fact = "work_item.verdict_kinds", op = "not_in", value = ["diagnosed"] },
]
[rule.remedy]
action = "assign"
produces = "diagnosed"
target_role = "recon"
[rule.remedy.params]
subject = "diagnosis of prior fix for work item {work_item_id}"
reviews = "{assignment_id}"
work_item = "{work_item_id}"

[[rule]]
name = "code-review-requires-passing-tests"
verb = "assign"
text = "code review needs the code author's passing-test receipt: the assignment holder must file a tests-passed verdict with the tested repository, commit, command or suite, and passing result"
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "assignment.is_producing_card", op = "eq", value = true },
  { fact = "assignment.state", op = "eq", value = "open" },
  { fact = "assignment.effect_kind", op = "eq", value = "code" },
  { fact = "assignment.holder_noted_verdict_kinds", op = "not_in", value = ["tests-passed"] },
]

# Spec-backed work is a slice of product: before its implementation
# dispatches, the product owner has rendered a spirit verdict on the spec.
# The rail checks that the verdict EXISTS; what it says — and who arranges
# the review — is entirely inference's (substrate records, inference acts).
# A DENY rather than an auto-summoning remedy, deliberately: the remedy
# engine anchors on an existing assignment, and a spec item's FIRST dispatch
# has none — and per the subtraction doctrine, teaching the engine a new
# anchor loses to naming the missing paper and letting a mind fetch it.
# Born from the adjudication postmortem: an 11-round spec pipeline ran
# spec->review->implementation with no product-owner edge to cross.
[[rule]]
name = "spec-dispatch-requires-spirit"
verb = "dispatch"
text = "spec-backed work needs a product-owner spirit verdict first: assign your product-owner a spirit review of this work item; a spirit-approved verdict releases this dispatch"
external_producer = true
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.has_spec_ref", op = "eq", value = true },
  { fact = "work_item.verdict_kinds", op = "not_in", value = ["spirit-approved"] },
]

# STAGED, NOT ARMED — the review-rounds doorbell. Product goal:
# at round four (recent norm is 1-2; the old process ran 4-10; grace built
# in), SHINE LIGHT on a review that may be spinning by summoning the product
# owner — while limiting nothing. The rails grammar has no non-blocking
# effect today (deny/remedy/escalate all gate the verb), and a doorbell that
# blocks IS the artificial limit the ruling forbids. Armed the day the
# grammar grows a `notice` effect (record + summon + allow); the fact it
# needs (assignment.review_verdict_count) ships now.
