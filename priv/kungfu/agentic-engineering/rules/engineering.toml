# Flagship enforced loop (roadmap P7): completion requires an independent review.
# A coder attesting completion without a reviewed-clean verdict is not denied — the
# substrate assigns a reviewer (the remedy), blocks the completion until the review
# lands, and self-releases. This is the reviewer-loop worked example, enforced.
[[rule]]
name = "completion-requires-review"
verb = "attest"
text = "completion needs a qualifying reviewed-clean verdict: check that it is on a card linked with --reviews, filed by that card's holder, not filed by this work's author, and cross-harness; if the linked verdict is changes-requested, address it and have the reviewer re-file reviewed-clean"
external_producer = false
edges = ["verb"]
effect = "remedy"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.is_producing_card", op = "eq", value = true },
  { fact = "assignment.cross_harness_verdict_kinds", op = "not_in", value = ["reviewed-clean"] },
]
[rule.remedy]
action = "assign"
produces = "reviewed-clean"
target_role = "reviewer"
[rule.remedy.params]
subject = "review of assignment {assignment_id}"
reviews = "{assignment_id}"

# Re-entry twin of completion-requires-review: after one completed fix on a bug
# work item, the next implementation dispatch first commissions an independent
# recon. The recon archetype elects bug-provenance; its diagnosed verdict releases
# the work-item-grain remedy episode and permits the re-fix dispatch.
[[rule]]
name = "refix-requires-diagnosis"
verb = "dispatch"
text = "a repeated bug fix requires an independent diagnosed verdict"
external_producer = false
edges = ["verb"]
effect = "remedy"
deny_when = [
  { fact = "work_item.is_bug", op = "eq", value = true },
  { fact = "assignment.prior_completed_fix_count", op = "gte", value = 1 },
  { fact = "assignment.independent_verdict_kinds", op = "not_in", value = ["diagnosed"] },
]
[rule.remedy]
action = "assign"
produces = "diagnosed"
target_role = "recon"
[rule.remedy.params]
subject = "diagnosis of prior fix for work item {work_item_id}"
reviews = "{assignment_id}"
work_item = "{work_item_id}"

# Spec-backed work is a slice of product: before its implementation
# dispatches, the product owner has rendered a spirit verdict on the spec.
# The rail checks that the verdict EXISTS; what it says — and who arranges
# the review — is entirely inference's (substrate records, inference acts).
# A DENY rather than an auto-summoning remedy, deliberately: the remedy
# engine anchors on an existing assignment, and a spec item's FIRST dispatch
# has none — and per the subtraction doctrine, teaching the engine a new
# anchor loses to naming the missing paper and letting a mind fetch it.
# Born from the adjudication postmortem: an 11-round spec pipeline ran
# spec->review->implementation with no product-owner edge to cross.
[[rule]]
name = "spec-dispatch-requires-spirit"
verb = "dispatch"
text = "spec-backed work needs a product-owner spirit verdict first: assign your product-owner a spirit review of this work item; a spirit-approved verdict releases this dispatch"
external_producer = true
edges = ["verb"]
effect = "deny"
deny_when = [
  { fact = "work_item.has_spec_ref", op = "eq", value = true },
  { fact = "work_item.verdict_kinds", op = "not_in", value = ["spirit-approved"] },
]

