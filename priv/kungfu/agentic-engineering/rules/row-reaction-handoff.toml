# Terminal policy is elected with the engineering bundle.
[[reaction]]
name = "assignment-terminal-handoff"
family = "terminal-handoff"
events = ["assignment"]
when = { op = "and", args = [{ op = "or", args = [{ op = "and", args = [{ op = "eq", args = [{ ref = "event.before.id" }, { ref = "event.after.id" }] }, { op = "eq", args = [{ ref = "event.before.state" }, "open"] }] }, { op = "eq", args = [{ ref = "event.historical" }, true] }] }, { op = "eq", args = [{ ref = "event.after.state" }, "closed"] }, { op = "or", args = [{ op = "and", args = [{ op = "eq", args = [{ ref = "terminal.source_kind" }, "attest"] }, { op = "in", args = [{ ref = "terminal.outcome" }, ["completed", "surrendered"]] }] }, { op = "and", args = [{ op = "eq", args = [{ ref = "terminal.source_kind" }, "assignment_revocation"] }, { op = "eq", args = [{ ref = "terminal.outcome" }, "revoked"] }] }] }] }
bind = [
  { name = "terminal", value = { ref = "event.terminal" } },
  { name = "active_sessions", value = { op = "filter", items = { ref = "facts.sessions" }, as = "session", where = { op = "and", args = [{ op = "eq", args = [{ ref = "session.ownerUserId" }, { ref = "terminal.owner_user_id" }] }, { op = "eq", args = [{ ref = "session.state" }, "active"] }] } } },
  { name = "current_owner", value = { op = "if", args = [{ op = "and", args = [{ op = "eq", args = [{ ref = "facts.delivery_owner.ownerUserId" }, { ref = "terminal.owner_user_id" }] }, { op = "eq", args = [{ ref = "facts.delivery_owner.deliveryState" }, "current"] }] }, { ref = "facts.delivery_owner.accountableSessionKey" }, { op = "first", args = [[]] }] } },
  { name = "candidates", value = { op = "unique", args = [{ op = "if", args = [{ op = "eq", args = [{ ref = "terminal.opened_by_kind" }, "session"] }, [{ op = "if", args = [{ op = "eq", args = [{ ref = "facts.opener_responsibility" }, "delegated"] }, { ref = "terminal.opened_by_id" }, { op = "first", args = [[]] }] }, { ref = "current_owner" }, { ref = "terminal.opened_by_id" }, { ref = "facts.personal_session_key" }], { op = "if", args = [{ op = "eq", args = [{ ref = "terminal.opened_by_kind" }, "process"] }, [{ ref = "facts.coordination_parent" }, { ref = "current_owner" }, { ref = "facts.personal_session_key" }], [{ ref = "current_owner" }, { ref = "facts.personal_session_key" }]] }] }] } },
  { name = "recipient", value = { op = "first", args = [{ op = "filter", items = { ref = "candidates" }, as = "key", where = { op = "gt", args = [{ op = "count", args = [{ op = "filter", items = { ref = "active_sessions" }, as = "session", where = { op = "eq", args = [{ ref = "session.sessionKey" }, { ref = "key" }] } }] }, 0] } }] } },
  { name = "wake_id", value = { op = "concat", args = ["w_terminal_", { op = "sha256", args = [{ op = "json", args = [["terminal-child-owner-notification", { ref = "terminal.source_kind" }, { ref = "terminal.source_token" }]] }] }] } }
]

[[reaction.effects]]
slot = "handoff"
kind = "notice"
when = true
value = { wake_id = { ref = "wake_id" }, session_key = { ref = "recipient" }, owner_user_id = { ref = "terminal.owner_user_id" }, origin = "process:tightbeam", creator_session_key = { ref = "terminal.child_session_key" }, assignment_id = { ref = "terminal.assignment_id" }, work_item_id = { ref = "terminal.work_item_id" }, prompt = { op = "concat", args = ["terminal-child-owner-notification", "\nsource_kind=", { op = "json", args = [{ ref = "terminal.source_kind" }] }, "\nsource_token=", { op = "json", args = [{ ref = "terminal.source_token" }] }, "\nassignment_id=", { op = "json", args = [{ ref = "terminal.assignment_id" }] }, "\nwork_item_id=", { op = "json", args = [{ ref = "terminal.work_item_id" }] }, "\nchild_session_key=", { op = "json", args = [{ ref = "terminal.child_session_key" }] }, "\nowner_user_id=", { op = "json", args = [{ ref = "terminal.owner_user_id" }] }, "\nopened_by_kind=", { op = "json", args = [{ ref = "terminal.opened_by_kind" }] }, "\nopened_by_id=", { op = "json", args = [{ ref = "terminal.opened_by_id" }] }, "\noutcome=", { op = "json", args = [{ ref = "terminal.outcome" }] }, "\nterminal_at=", { op = "json", args = [{ ref = "terminal.terminal_at" }] }] }, due_at = { ref = "event.at" }, target_gate = 0, on_unavailable = "undelivered", unavailable = { session_key = { op = "if", args = [{ op = "eq", args = [{ ref = "terminal.opened_by_kind" }, "session"] }, { ref = "terminal.opened_by_id" }, { ref = "facts.personal_session_key" }] }, reason = "terminal_notification_recipient_unavailable" }, obligation_ref = { op = "concat", args = ["terminal-child-owner-notification:", { ref = "terminal.assignment_id" }] } }
