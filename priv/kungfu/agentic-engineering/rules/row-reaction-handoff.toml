# Recipient absence preserves an undelivered intent at its elected durable address.
[[reaction]]
name = "assignment-terminal-handoff"
family = "terminal-handoff"
events = ["assignment"]
when = { op = "and", args = [{ op = "or", args = [{ op = "and", args = [{ op = "eq", args = [{ ref = "event.before.id" }, { ref = "assignment.id" }] }, { op = "eq", args = [{ ref = "event.before.state" }, "open"] }] }, { op = "and", args = [{ op = "eq", args = [{ ref = "event.historical" }, true] }, { op = "is_null", args = [{ ref = "event.before" }] }] }] }, { op = "eq", args = [{ ref = "assignment.state" }, "closed"] }, { op = "or", args = [{ op = "and", args = [{ op = "eq", args = [{ ref = "event.source.kind" }, "attest"] }, { op = "in", args = [{ ref = "assignment.outcome" }, ["completed", "surrendered"]] }] }, { op = "and", args = [{ op = "eq", args = [{ ref = "event.source.kind" }, "assignment_revocation"] }, { op = "eq", args = [{ ref = "assignment.outcome" }, "revoked"] }] }] }] }
bind = [
  { name = "assignment", value = { ref = "event.after" } },
  { name = "original", value = { op = "if", args = [{ op = "is_null", args = [{ ref = "facts.original" }] }, { ref = "facts" }, { ref = "facts.original" }] } },
  { name = "original_opener", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "original.sessions" }, []] }, as = "s", where = { op = "eq", args = [{ ref = "s.sessionKey" }, { ref = "assignment.openedBySession" }] } }] } },
  { name = "opener_session", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.sessions" }, []] }, as = "s", where = { op = "eq", args = [{ ref = "s.sessionKey" }, { ref = "assignment.openedBySession" }] } }] } },
  { name = "opener_kind", value = { op = "if", args = [{ op = "is_null", args = [{ ref = "assignment.openedBySession" }] }, "user", "session"] } },
  { name = "opener_id", value = { op = "coalesce", args = [{ ref = "assignment.openedBySession" }, { ref = "assignment.openedByUser" }] } },
  { name = "owner_id", value = { op = "if", args = [{ op = "eq", args = [{ ref = "opener_kind" }, "user"] }, { ref = "assignment.openedByUser" }, { ref = "original_opener.ownerUserId" }] } },
  { name = "owner", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.users" }, []] }, as = "u", where = { op = "eq", args = [{ ref = "u.userId" }, { ref = "owner_id" }] } }] } },
  { name = "owner_relation_valid", value = { op = "and", args = [{ op = "not", args = [{ op = "is_null", args = [{ ref = "owner_id" }] }] }, { op = "eq", args = [{ ref = "owner.userId" }, { ref = "owner_id" }] }, { op = "or", args = [{ op = "eq", args = [{ ref = "opener_kind" }, "user"] }, { op = "eq", args = [{ ref = "opener_session.ownerUserId" }, { ref = "owner_id" }] }] }, { op = "or", args = [{ op = "is_null", args = [{ ref = "assignment.workItemId" }] }, { op = "and", args = [{ op = "eq", args = [{ ref = "facts.work_item.id" }, { ref = "assignment.workItemId" }] }, { op = "eq", args = [{ ref = "facts.work_item.ownerUserId" }, { ref = "owner_id" }] }] }] }] } },
  { name = "active_sessions", value = { op = "filter", items = { op = "coalesce", args = [{ ref = "facts.sessions" }, []] }, as = "s", where = { op = "and", args = [{ op = "eq", args = [{ ref = "s.ownerUserId" }, { ref = "owner_id" }] }, { op = "eq", args = [{ ref = "s.state" }, "active"] }] } } },
  { name = "current_owner", value = { op = "first", args = [{ op = "filter", items = { ref = "active_sessions" }, as = "s", where = { op = "and", args = [{ op = "eq", args = [{ ref = "facts.work_item.id" }, { ref = "assignment.workItemId" }] }, { op = "eq", args = [{ ref = "facts.work_item.ownerUserId" }, { ref = "owner_id" }] }, { op = "eq", args = [{ ref = "s.sessionKey" }, { ref = "facts.work_item.deliveryOwnerSessionKey" }] }] } }] } },
  { name = "opener_work", value = { op = "filter", items = { op = "coalesce", args = [{ ref = "facts.assignments" }, []] }, as = "a", where = { op = "and", args = [{ op = "eq", args = [{ ref = "a.workItemId" }, { ref = "assignment.workItemId" }] }, { op = "eq", args = [{ ref = "a.holderKey" }, { ref = "assignment.openedBySession" }] }, { op = "eq", args = [{ ref = "a.state" }, "open"] }] } } },
  { name = "delegated_opener", value = { op = "if", args = [{ op = "and", args = [{ op = "eq", args = [{ ref = "opener_kind" }, "session"] }, { op = "not", args = [{ op = "eq", args = [{ ref = "current_owner.sessionKey" }, { ref = "opener_id" }] }] }, { op = "eq", args = [{ ref = "facts.work_item.id" }, { ref = "assignment.workItemId" }] }, { op = "eq", args = [{ ref = "facts.work_item.ownerUserId" }, { ref = "owner_id" }] }, { op = "gt", args = [{ op = "count", args = [{ ref = "opener_work" }] }, 0] }] }, { ref = "opener_id" }, { op = "first", args = [[]] }] } },
  { name = "candidate_keys", value = { op = "unique", args = [{ op = "if", args = [{ op = "eq", args = [{ ref = "opener_kind" }, "session"] }, [{ ref = "delegated_opener" }, { ref = "current_owner.sessionKey" }, { ref = "opener_id" }, { ref = "owner.personalSessionKey" }], [{ ref = "current_owner.sessionKey" }, { ref = "owner.personalSessionKey" }]] }] } },
  { name = "candidate_sessions", value = { op = "map", items = { ref = "candidate_keys" }, as = "key", value = { op = "first", args = [{ op = "filter", items = { ref = "active_sessions" }, as = "s", where = { op = "eq", args = [{ ref = "s.sessionKey" }, { ref = "key" }] } }] } } },
  { name = "recipient", value = { op = "first", args = [{ op = "filter", items = { ref = "candidate_sessions" }, as = "s", where = { op = "not", args = [{ op = "is_null", args = [{ ref = "s.sessionKey" }] }] } }] } },
  { name = "wake_id", value = { op = "if", args = [{ op = "eq", args = [{ ref = "event.historical" }, true] }, { ref = "event.wakeId" }, { op = "concat", args = ["w_terminal_", { op = "sha256", args = [{ op = "json", args = [["terminal-child-owner-notification", { ref = "event.source.kind" }, { ref = "event.source.id" }]] }] }] }] } },
]

[[reaction.effects]]
slot = "handoff"
kind = "notice"
when = true
value = { wake_id = { ref = "wake_id" }, session_key = { op = "if", args = [{ ref = "owner_relation_valid" }, { ref = "recipient.sessionKey" }, { op = "first", args = [[]] }] }, owner_user_id = { ref = "owner_id" }, origin = "process:tightbeam", creator_session_key = { ref = "assignment.holderKey" }, assignment_id = { ref = "assignment.id" }, work_item_id = { ref = "assignment.workItemId" }, prompt = { op = "concat", args = ["terminal-child-owner-notification", "\nsource_kind=", { op = "json", args = [{ ref = "event.source.kind" }] }, "\nsource_token=", { op = "json", args = [{ ref = "event.source.id" }] }, "\nassignment_id=", { op = "json", args = [{ ref = "assignment.id" }] }, "\nwork_item_id=", { op = "json", args = [{ ref = "assignment.workItemId" }] }, "\nchild_session_key=", { op = "json", args = [{ ref = "assignment.holderKey" }] }, "\nowner_user_id=", { op = "json", args = [{ ref = "owner_id" }] }, "\nopened_by_kind=", { op = "json", args = [{ ref = "opener_kind" }] }, "\nopened_by_id=", { op = "json", args = [{ ref = "opener_id" }] }, "\noutcome=", { op = "json", args = [{ ref = "assignment.outcome" }] }, "\nterminal_at=", { op = "json", args = [{ ref = "event.at" }] }] }, due_at = { ref = "event.at" }, target_gate = 0, on_unavailable = "undelivered", unavailable = { session_key = { op = "if", args = [{ op = "eq", args = [{ ref = "opener_kind" }, "session"] }, { ref = "opener_id" }, { ref = "owner.personalSessionKey" }] }, purpose = "terminal-child-owner-notification", reason = { op = "if", args = [{ ref = "owner_relation_valid" }, "terminal_notification_recipient_unavailable", "invalid_terminal_notification_relation"] } }, obligation_ref = { op = "concat", args = ["terminal-child-owner-notification:", { ref = "assignment.id" }] } }
