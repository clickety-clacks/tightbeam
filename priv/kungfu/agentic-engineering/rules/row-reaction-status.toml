bind = [
  { name = "assignment", value = { ref = "facts.assignment" } },
  { name = "holder_starts", value = { op = "sort", items = { op = "filter", items = { op = "coalesce", args = [{ ref = "facts.turns" }, []] }, as = "turn", where = { op = "and", args = [{ op = "eq", args = [{ ref = "turn.assignmentId" }, { ref = "assignment.id" }] }, { op = "eq", args = [{ ref = "turn.sessionKey" }, { ref = "assignment.holderKey" }] }, { op = "not", args = [{ op = "is_null", args = [{ ref = "turn.startedAt" }] }] }] } }, as = "turn", value = [{ ref = "turn.startedAt" }, { ref = "turn.seq" }] } },
  { name = "first_start", value = { op = "first", args = [{ ref = "holder_starts" }] } },
  { name = "user_opener", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.users" }, []] }, as = "user", where = { op = "eq", args = [{ ref = "user.userId" }, { ref = "assignment.openedByUser" }] } }] } },
  { name = "opener_key", value = { op = "coalesce", args = [{ ref = "assignment.openedBySession" }, { ref = "user_opener.personalSessionKey" }] } },
  { name = "recipient", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.sessions" }, []] }, as = "session", where = { op = "and", args = [{ op = "eq", args = [{ ref = "session.sessionKey" }, { ref = "opener_key" }] }, { op = "or", args = [{ op = "is_null", args = [{ ref = "assignment.openedByUser" }] }, { op = "eq", args = [{ ref = "session.ownerUserId" }, { ref = "assignment.openedByUser" }] }] }] } }] } },
