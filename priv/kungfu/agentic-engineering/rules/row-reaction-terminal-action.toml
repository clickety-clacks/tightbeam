# Only actual successful delivery arms the next reminder.
[[reaction]]
name = "terminal-child-action-reminder"
family = "terminal-action"
events = ["wake_delivery"]
when = { op = "and", args = [{ op = "in", args = [{ ref = "delivered.obligationNamespace" }, ["terminal-child-owner-notification", "terminal-child-owner-action-reminder"]] }, { op = "eq", args = [{ ref = "source.sourceKind" }, "attest"] }, { op = "in", args = [{ ref = "source.outcome" }, ["completed", "surrendered"]] }, { op = "eq", args = [{ ref = "root.obligationNamespace" }, "terminal-child-owner-notification"] }, { op = "eq", args = [{ ref = "root.obligationTarget" }, { ref = "source.assignmentId" }] }, { op = "eq", args = [{ ref = "root.assignmentId" }, { ref = "source.assignmentId" }] }, { op = "eq", args = [{ ref = "root.creatorSessionKey" }, { ref = "source.childSessionKey" }] }, { op = "eq", args = [{ ref = "root.ownerUserId" }, { ref = "source.ownerUserId" }] }, { op = "eq", args = [{ ref = "root.sessionKey" }, { ref = "event.delivery.sessionKey" }] }, { op = "eq", args = [{ ref = "root.origin" }, "process:tightbeam"] }, { op = "not", args = [{ op = "is_null", args = [{ ref = "root.deliveredTurnSeq" }] }] }, { op = "eq", args = [{ ref = "delivered.sessionKey" }, { ref = "event.delivery.sessionKey" }] }, { op = "eq", args = [{ ref = "delivered.ownerUserId" }, { ref = "source.ownerUserId" }] }, { op = "eq", args = [{ ref = "delivered.creatorSessionKey" }, { ref = "source.childSessionKey" }] }, { op = "eq", args = [{ ref = "delivered.origin" }, "process:tightbeam"] }, { op = "or", args = [{ ref = "initial" }, { op = "is_null", args = [{ ref = "delivered.assignmentId" }] }] }, { op = "not", args = [{ op = "is_null", args = [{ ref = "parent.sessionKey" }] }] }, { op = "gt", args = [{ op = "count", args = [{ ref = "destinations" }] }, 0] }, { op = "eq", args = [{ op = "count", args = [{ ref = "receipts" }] }, 0] }] }
bind = [
  { name = "delivered", value = { ref = "event.after" } },
  { name = "initial", value = { op = "eq", args = [{ ref = "delivered.obligationNamespace" }, "terminal-child-owner-notification"] } },
  { name = "root_id", value = { op = "if", args = [{ ref = "initial" }, { ref = "delivered.wakeId" }, { ref = "delivered.obligationTarget" }] } },
  { name = "root", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.wakes" }, []] }, as = "wake", where = { op = "eq", args = [{ ref = "wake.wakeId" }, { ref = "root_id" }] } }] } },
  { name = "source", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.terminal_sources" }, []] }, as = "source", where = { op = "eq", args = [{ ref = "source.wakeId" }, { ref = "root_id" }] } }] } },
  { name = "predecessor", value = { op = "if", args = [{ ref = "initial" }, { op = "first", args = [[]] }, { ref = "delivered.wakeId" }] } },
  { name = "parent", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.sessions" }, []] }, as = "session", where = { op = "and", args = [{ op = "eq", args = [{ ref = "session.sessionKey" }, { ref = "event.delivery.sessionKey" }] }, { op = "eq", args = [{ ref = "session.ownerUserId" }, { ref = "source.ownerUserId" }] }, { op = "eq", args = [{ ref = "session.state" }, "active"] }] } }] } },
  { name = "destinations", value = { op = "filter", items = { op = "coalesce", args = [{ ref = "facts.assignments" }, []] }, as = "assignment", where = { op = "and", args = [{ op = "eq", args = [{ ref = "assignment.holderKey" }, { ref = "event.delivery.sessionKey" }] }, { op = "eq", args = [{ ref = "assignment.state" }, "open"] }] } } },
  { name = "receipts", value = { op = "filter", items = { op = "coalesce", args = [{ ref = "facts.attests" }, []] }, as = "attest", where = { op = "and", args = [{ op = "eq", args = [{ ref = "attest.kind" }, "progress"] }, { op = "eq", args = [{ ref = "attest.bySession" }, { ref = "event.delivery.sessionKey" }] }, { op = "eq", args = [{ ref = "attest.disposition.assignmentId" }, { ref = "source.assignmentId" }] }, { op = "eq", args = [{ ref = "attest.disposition.sourceKind" }, { ref = "source.sourceKind" }] }, { op = "eq", args = [{ ref = "attest.disposition.sourceToken" }, { ref = "source.sourceToken" }] }] } } },
  { name = "wake_id", value = { op = "concat", args = ["w_terminal_action_", { op = "sha256", args = [{ op = "json", args = [["terminal-child-owner-action-reminder", { ref = "root_id" }, { op = "coalesce", args = [{ ref = "predecessor" }, "initial"] }]] }] }] } },
  { name = "current_action", value = { op = "first", args = [{ op = "filter", items = { op = "coalesce", args = [{ ref = "facts.reaction_actions" }, []] }, as = "action", where = { op = "and", args = [{ op = "eq", args = [{ ref = "action.family" }, "terminal-action"] }, { op = "eq", args = [{ ref = "action.slot" }, "reminder"] }] } }] } },
  { name = "current_output", value = { op = "coalesce", args = [{ ref = "current_action.result.wake_id" }, { op = "if", args = [{ op = "eq", args = [{ ref = "event.historical" }, true] }, { ref = "event.wakeId" }, { op = "first", args = [[]] }] }] } },
]

[[reaction.effects]]
slot = "reminder"
kind = "notice"
when = true
withdraw = { op = "if", args = [{ op = "gt", args = [{ op = "count", args = [{ ref = "receipts" }] }, 0] }, { requester_id = "tightbeam:supervision", reason_kind = "superseded", source_kind = "progress_attest", source_id = { op = "first", args = [{ op = "map", items = { ref = "receipts" }, as = "receipt", value = { ref = "receipt.id" } }] } }, { op = "if", args = [{ op = "and", args = [{ op = "not", args = [{ op = "is_null", args = [{ ref = "current_output" }] }] }, { op = "or", args = [{ op = "is_null", args = [{ ref = "parent.sessionKey" }] }, { op = "eq", args = [{ op = "count", args = [{ ref = "destinations" }] }, 0] }] }] }, { requester_id = "tightbeam:wake-scheduler", reason_kind = "target_unresolvable", source_kind = "scheduler_delivery", source_id = { ref = "current_output" } }, { op = "first", args = [[]] }] }] }
value = { wake_id = { ref = "wake_id" }, session_key = { ref = "event.delivery.sessionKey" }, owner_user_id = { ref = "source.ownerUserId" }, origin = "process:tightbeam", creator_session_key = { ref = "source.childSessionKey" }, due_at = { op = "add", args = [{ ref = "event.at" }, 7200000] }, target_gate = 1, on_unavailable = "skip", obligation_ref = { op = "concat", args = ["terminal-child-owner-action-reminder:", { ref = "root_id" }] }, prompt = { op = "concat", args = ["A parent action is still due for child assignment ", { ref = "source.assignmentId" }, " (finish occurrence ", { ref = "source.sourceKind" }, "/", { ref = "source.sourceToken" }, "). Choose keep, park, or retire based on current purpose and obligations, act within your existing authority, then record what you did on an open assignment with a progress attest naming this child and occurrence. Use note: completion-handoff-action ", { ref = "source.assignmentId" }, " ", { ref = "source.sourceKind" }, " ", { ref = "source.sourceToken" }, " kept|parked|retired: <what you did>. A refusal or failed action must be reported truthfully. Notice ", { ref = "root_id" }, "."] } }
