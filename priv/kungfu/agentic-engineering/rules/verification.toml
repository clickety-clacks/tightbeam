# rules/verification.toml — the engineering school's completion papertrail
[[rule]]
name = "completion-requires-verification"
verb = "attest"
edges = ["verb"]
effect = "remedy"
text = "completion requires a verification verdict on the assignment"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.holder_archetype", op = "in", value = ["coder"] },
  { fact = "assignment.verdicts", op = "not_in", value = ["verified"] },
]
[rule.remedy]
action = "wake"
produces = "verified"
target_session = "{holder_key}"
[rule.remedy.params]
prompt = "Your completion of {assignment_id} is blocked: no verification verdict is filed. Verify the work the way this repository defines verification (its AGENTS.md or equivalent prose), then file `tightbeam attest {assignment_id} --kind verdict --verdict verified` with a note saying what you ran and what you observed."

# Widened 2026-08-18 from coder-only to the other archetypes whose deliverable is
# a FILE. The shape was right and already proven; only its reach was short, and
# the loss concentrated exactly where it did not reach. Measured across the fleet that
# day, closed assignments carrying NO artifact on their work item: review sessions
# 456/682, spec-writer 35/71, recon 34/148 — against coder's 118/397, the one
# archetype this rule already covered.
#
# REVIEWER BELONGS HERE, and the tempting argument against it is wrong. "A
# review's deliverable is its verdict, and a verdict is already a durable row"
# holds only if the verdict can carry the review. It cannot: the note field caps
# at 2000 characters, and reviewers already route around it in the open — "FULL
# CLAUSE TABLE + EVIDENCE: art_xxxxxxx, the 2000-char note cap forced the card's
# clause table". So a review holder that files a verdict and records nothing has kept
# the DECISION and dropped the REASONING behind it. The review document is the
# verdict's substance, not an optional companion to it.
#
# The product owner ruled the real fix on 2026-08-18: a verdict should POINT AT an artifact
# rather than carry a capped note, which makes review context durable by
# construction and retires this clause for reviewers. Until that lands (0.2
# design), this rail is the interim that keeps the reasoning attached to the
# decision. A workspace with no artifact rows is
# REMOVED when it closes (artifacts-and-reconciliation.md, ratified floor), so an
# unrecorded report is not a filing lapse but a deletion: 7 of 10 workdir paths
# cited as evidence by attests in a single day no longer existed.
#
# The kind list widened with it. `report` alone would have blocked a spec-writer
# holding a perfectly good spec, because the fact carries the kinds the holder
# ACTUALLY recorded; this asks whether the work left a record at all, never which
# sort of record the archetype should have chosen.
[[rule]]
name = "completion-requires-results-artifact"
verb = "attest"
edges = ["verb"]
effect = "remedy"
text = "completion requires a recorded results artifact from the holder"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.holder_archetype", op = "in", value = ["coder", "reviewer-code", "reviewer-spec", "spec-writer", "recon"] },
  { fact = "assignment.artifact_kinds", op = "not_in", value = ["report", "spec", "doc", "data", "other"] },
]
[rule.remedy]
action = "wake"
target_session = "{holder_key}"
[rule.remedy.params]
prompt = "Your completion of {assignment_id} is blocked: no artifact is recorded on its work item. Your session workspace is REMOVED when it closes, so a document you did not record is destroyed with it — the row survives and the bytes do not. Record what you produced (report, spec, evidence, logs) with `tightbeam artifact-record --kind <kind> --title <title> --path <path> --work-item <workItemId>`, then complete."

[[policy]]
name = "accountable-dependency-verifier"
purpose = "wait-verification-admission"
when = [
  { fact = "verifier.open", op = "eq", value = true },
  { fact = "verifier.holder_is_other", op = "eq", value = true },
]
verification = { trigger = "registration", terminal = "bound-verdict-or-obligation-terminal", fallback = "wake-due-at" }

[[policy]]
name = "holder-continuation-coverage"
purpose = "wait-prod-coverage"
when = [
  { fact = "wait.obligation_matches", op = "eq", value = true },
  { fact = "wait.admitted", op = "eq", value = true },
  { fact = "wait.after_turn_eligible", op = "eq", value = true },
  { fact = "wait.coverage_valid", op = "eq", value = true },
  { fact = "wait.continuation_state", op = "in", value = ["pending", "queued", "running"] },
]

[[policy]]
name = "justified-unresolved-dependency"
purpose = "wait-effort-relief"
when = [
  { fact = "wait.obligation_matches", op = "eq", value = true },
  { fact = "wait.admitted", op = "eq", value = true },
  { fact = "wait.continuation_state", op = "eq", value = "pending" },
  { fact = "wait.recognized", op = "eq", value = false },
  { fact = "resolver.open", op = "eq", value = true },
  { fact = "resolver.owed_by_other", op = "eq", value = true },
  { fact = "wait.declaration_complete", op = "eq", value = true },
  { fact = "wait.verification_accountable", op = "eq", value = true },
  { fact = "wait.verification_state", op = "in", value = ["provisional", "confirmed"] },
]

[[rule]]
name = "wake-obligation-registration-authority"
verb = "wake"
edges = ["verb"]
effect = "deny"
text = "Register this obligation wake as its holder or through an authorized ancestor."
deny_when = [
  { fact = "wake.has_obligation", op = "eq", value = true },
  { fact = "wake.registrant_is_holder", op = "eq", value = false },
  { fact = "wake.registrant_is_ancestor", op = "eq", value = false },
]
