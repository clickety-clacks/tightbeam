root_archetype = "harklight-decision-briefings.orchestrator"
purpose = "An example template to configure, not a built-in conversion: Tightbeam ships only the decision-request-filed rule hook. It routes decision requests through a configurable investigator, preserves its Harklight conversation, and reconciles staged catchup without duplicate briefings. A filed decision request is already a proper ask; a Harklight briefing is optional and a refused briefing send does not block it."
