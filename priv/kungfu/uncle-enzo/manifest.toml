root_archetype = "uncle-enzo.exec"
primary = true
purpose = "Run your organization with executives who hold your intent and talk to you, and deliverators who own getting each feature or concern delivered."
phrases = [
  "I want one agent to talk to, and I don't want it buried in status traffic.",
  "My coordinators spend more time messaging each other than shipping.",
  "I want each feature to have one owner who sees it through.",
  "I want my agents to coordinate with each other directly.",
]

[[sentinels]]
name = "github-landing-watch"
command = "sentinels/github-landing-watch"
requires = ["GH_CONFIG_DIR"]

[[events]]
name = "landing.settled"
description = "A demanded GitHub pull request merged, closed, or stopped progressing automatically."
details = [
  { name = "scope", description = "Repository and pull request number." },
  { name = "outcome", description = "Observed landing disposition." },
  { name = "head", description = "Observed pull request head commit." },
  { name = "base", description = "Observed base branch." },
  { name = "commit", description = "Merge commit, or an empty string before merge." },
  { name = "evidence", description = "GitHub evidence URL." },
]

[[events]]
name = "pr.checks-completed"
description = "Required checks observed on a demanded exact pull request head have completed."
details = [
  { name = "scope", description = "Repository and pull request number." },
  { name = "head", description = "Commit checked." },
  { name = "outcome", description = "Observed pass or fail." },
  { name = "evidence", description = "GitHub checks URL." },
]

[[events]]
name = "landing.branch-attention"
description = "A required check failed on a demanded branch tip."
details = [
  { name = "scope", description = "Repository and branch." },
  { name = "head", description = "Commit checked." },
  { name = "check", description = "Required failing check." },
  { name = "evidence", description = "GitHub evidence URL." },
]

[[mementos]]
name = "integration-target"
records = ["work_item", "assignment"]

[[mementos]]
name = "pull-request"
records = ["work_item", "assignment", "attest"]
many = true

[[mementos]]
name = "merge"
records = ["work_item", "assignment", "attest"]
many = true

[[mementos]]
name = "evidence"
records = ["work_item", "assignment", "attest"]
many = true
