[fixture]
class = "C4"
name = "cross-provider"
phase = "pending"
blocking_phase = "P3"
kind = "dispatch-rule"
source = "assignment.latest_linked_review; review selection is provider-neutral"
legibility = "event:denied(rule=cross-provider-review)"

[[fixture.rule]]
name = "cross-provider-review"
verb = "attest"
external_producer = true
text = "completion needs one qualifying reviewed-clean verdict regardless of provider"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.is_producing_card", op = "eq", value = true },
]
require = [
  { fact = "assignment.latest_linked_review.present", op = "eq", value = true },
  { fact = "assignment.latest_linked_review.judgment_kind", op = "in", value = ["reviewed-clean"] },
  { fact = "assignment.latest_linked_review.independent", op = "eq", value = true },
]
