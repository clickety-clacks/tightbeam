# Independent review kinds are a set of holder-filed verdicts on linked cards.
# Card lifecycle and later verdicts do not withdraw an earlier independent clean.
# Self-held cards and nonholder filings do not contribute to that set.
[[fixture.rule]]
name = "coder-completion-needs-independent-review"
verb = "attest"
external_producer = true
text = "completion needs a linked reviewed-clean verdict by the review card's different-session holder"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.independent_verdict_kinds", op = "not_in", value = ["reviewed-clean"] },
]
