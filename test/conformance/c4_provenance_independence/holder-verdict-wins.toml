[fixture]
class = "C4"
name = "holder-verdict-wins"
phase = "pending"
blocking_phase = "P3"
kind = "dispatch-rule"
source = "coordination-fabric-v1 §13 Phase 0; wedge class"
legibility = "event:denied(rule=coder-completion-needs-independent-review)"

# Review judgments come from holder-filed verdict rows, never from bare card
# lifecycle recency. A verdictless round therefore cannot displace a standing
# judgment, even when the verdictless card is terminal.
[[fixture.rule]]
name = "coder-completion-needs-independent-review"
verb = "attest"
external_producer = true
text = "completion needs a linked reviewed-clean verdict by the review card's different-session holder"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.is_producing_card", op = "eq", value = true },
]
require = [
  { fact = "assignment.latest_linked_review.present", op = "eq", value = true },
  { fact = "assignment.latest_linked_review.judgment_kind", op = "in", value = ["reviewed-clean"] },
  { fact = "assignment.latest_linked_review.independent", op = "eq", value = true },
]
