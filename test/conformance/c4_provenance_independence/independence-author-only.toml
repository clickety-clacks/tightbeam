[fixture]
class = "C4"
name = "independence-author-only"
phase = "pending"
blocking_phase = "P3"
kind = "dispatch-rule"
source = "assignment.latest_linked_review"
legibility = "event:denied(rule=commissioned-author-only)"

[[fixture.rule]]
