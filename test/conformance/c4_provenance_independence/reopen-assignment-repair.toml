# holder-verdict-wins.cases.jsonl exercises the SELECTION fix by calling only
# `attest` — it never routes `reopen-assignment` itself through the dispatch
# chokepoint, so CLI/wire routing, rule evaluation, and conformance-world
# authorization for the new verb could break while direct handler tests stayed
# green. This fixture calls `reopen-assignment` directly.
#
# Authority is opener-or-HOLDER-or-admin (philosophy gate Law 3: the mind that
# owes the replacement verdict needs its own exit). The defining displacement
# shape is the class the verb exists to repair: an earlier round that carries a
# verdict (closed carrying the WRONG one) plus a later, verdictless closed
# round that never qualifies for selection and must not distract the repair.
# Reopening the earlier round and filing a corrected verdict is verified to
# actually clear the producer's completion — the repair, not just the reopen.
[[fixture.rule]]
name = "coder-completion-needs-independent-review"
verb = "attest"
external_producer = true
text = "completion needs a linked reviewed-clean verdict by the review card's different-session holder"
deny_when = [
  { fact = "attest.kind", op = "eq", value = "completion" },
  { fact = "assignment.applicable_review_verdict_kinds", op = "not_in", value = ["reviewed-clean"] },
]
