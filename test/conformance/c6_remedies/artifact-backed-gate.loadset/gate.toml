[[rule]]
name = "artifact-backed-gate"
verb = "attest"
text = "requires a holder-recorded results artifact"
effect = "remedy"
deny_when = [{ fact = "assignment.artifact_kinds", op = "not_in", value = ["report"] }]
[rule.remedy]
action = "wake"
target_session = "{holder_key}"
[rule.remedy.params]
prompt = "record the verification results as a report artifact for {assignment_id}, then complete"
