# THE INVARIANT THIS FIXTURE EXISTS TO HOLD DOWN: a page boundary loses no row
# and repeats none (Law 2 — an optimization that loses rows is wrong, full
# stop). Three ways to break it, and each has its own case:
#
#   1. Ordering on a wall clock alone. `attests` sorts on `(ts, id)` and two
#      attests can land in the same millisecond, so a `ts`-only cursor either
#      repeats the tied rows or skips them. The cases below deliberately file
#      their attests as fast as the runner can, and the contract is stated over
#      the CONCATENATION of the pages, not over one page's contents.
#   2. A default page size. There is none, on either verb: a default would
#      silently shorten every answer that existed before this seam.
#   3. Paging a shape that has no lawful boundary. `toplines --tree` derives
#      nesting across the whole appearing set, so a limit either orphans
#      subtrees or pulls in nodes it excluded. REFUSED BY NAME — a wrong answer
#      that looks right is the worst thing this seam could ship.
#
# The cursor is also an AUTHORIZATION surface: an id naming rows the caller
# cannot see must answer exactly as an id naming nothing, or the cursor is an
# existence oracle. Both refusal cases pin that.
