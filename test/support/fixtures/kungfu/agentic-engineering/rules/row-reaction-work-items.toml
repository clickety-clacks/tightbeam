[[reaction]]
policy_context = "organization"
name = "r04-work-item-notice"
family = "r04-work-item"
archetypes = ["agentic-engineering.coder", "agentic-engineering.guidance-reviewer", "agentic-engineering.guidance-writer", "agentic-engineering.integrator", "agentic-engineering.orchestrator", "agentic-engineering.pdo", "agentic-engineering.product-owner", "agentic-engineering.recon", "agentic-engineering.reviewer-code", "agentic-engineering.reviewer-spec", "agentic-engineering.spec-writer", "agentic-engineering.team-planner"]
events = ["work_item_observation"]
english = "Owning bundle: agentic-engineering. Organization policy context: recipient archetypes do not change election. On work-item creation or reopen, remind the personal owner after the configured triage interval (one day by default) to route or icebox the item. An actual delivery of the current saved routing wake admits its next reminder at the same interval, while the item stays open. Owner handoff alone does not stop it. Assignment transitions and terminal disposition withdraw it through the cancellation rail. An unrelated, pending or failed wake never rearms it."
when = { op = "and", args = [{ op = "eq", args = [{ ref = "facts.work_item.state" }, "open"] }, { op = "or", args = [{ op = "eq", args = [{ ref = "facts.work_item.routingWakeId" }, { ref = "event.after.routingWakeId" }] }, { op = "eq", args = [{ ref = "facts.work_item.routingWakeId" }, { ref = "wake_id" }] }] }, { op = "or", args = [{ op = "in", args = [{ ref = "event.operation" }, ["created", "reopened"]] }, { op = "and", args = [{ op = "eq", args = [{ ref = "event.operation" }, "delivered"] }, { op = "eq", args = [{ ref = "event.before.deliveredWakeId" }, { ref = "event.after.routingWakeId" }] }, { op = "not", args = [{ op = "is_null", args = [{ ref = "event.after.routingWakeId" }] }] }] }] }] }
bind = [{ name = "wake_id", value = { op = "concat", args = ["w_reaction_", { op = "sha256", args = [{ op = "json", args = [[{ ref = "event.id" }, "r04", "notice"]] }] }] } }, { name = "recipient", value = { ref = "facts.personal_session_key" } }, { name = "interval", value = { op = "coalesce", args = [{ ref = "facts.configured_triage_deadline_ms" }, 86400000] } }]
[[reaction.effects]]
slot = "notice"
kind = "notice"
when = true
value = { wake_id = { ref = "wake_id" }, session_key = { ref = "recipient" }, owner_user_id = { ref = "event.org" }, origin = "process:tightbeam", template = "work-item-routing", arguments = { work_item_id = { ref = "event.workItemId" }, title = { ref = "facts.work_item.title" } }, due_at = { op = "add", args = [{ op = "coalesce", args = [{ ref = "event.scheduleBaseAt" }, { ref = "event.at" }] }, { ref = "interval" }] }, work_item_id = { ref = "event.workItemId" }, sender_scheduled = true, on_unavailable = "schedule", reference = { resource = "work_item", id = { ref = "event.workItemId" }, field = "routingWakeId", expected = { ref = "event.after.routingWakeId" } } }

[[reaction]]
policy_context = "organization"
name = "r04-work-item-withdraw"
family = "r04-work-item-withdraw"
archetypes = ["agentic-engineering.coder", "agentic-engineering.guidance-reviewer", "agentic-engineering.guidance-writer", "agentic-engineering.integrator", "agentic-engineering.orchestrator", "agentic-engineering.pdo", "agentic-engineering.product-owner", "agentic-engineering.recon", "agentic-engineering.reviewer-code", "agentic-engineering.reviewer-spec", "agentic-engineering.spec-writer", "agentic-engineering.team-planner"]
events = ["work_item_observation"]
english = "Owning bundle: agentic-engineering. Organization policy context: recipient archetypes do not change election. When an assignment routing/reopen transition or terminal work-item disposition supplies its typed disposition record, cancel the saved routingWakeId wake if pending, preserve fired or canceled wake history, and clear that pointer atomically. Missing referenced wake history or refused cancellation refuses the source transaction. Owner handoff alone emits no such transition. No elected rail suppresses only this automatic cancellation."
when = { op = "and", args = [{ op = "eq", args = [{ ref = "event.operation" }, "transition"] }, { op = "not", args = [{ op = "is_null", args = [{ ref = "event.after.routingWakeId" }] }] }] }
[[reaction.effects]]
slot = "withdraw"
kind = "cancel_notice"
when = true
value = { wake_id = { ref = "event.after.routingWakeId" }, session_key = { ref = "facts.personal_session_key" }, reference = { resource = "work_item", id = { ref = "event.workItemId" }, field = "routingWakeId", expected = { ref = "event.after.routingWakeId" } }, withdraw = { requester_id = "tightbeam:work-items", reason_kind = "routing_bracket_satisfied", source_kind = { ref = "event.transition.causal_source.kind" }, source_id = { ref = "event.transition.causal_source.id" }, outcome = { ref = "event.transition.outcome" } } }

[[reaction]]
policy_context = "organization"
name = "r05-work-item-notice"
family = "r05-work-item"
archetypes = ["agentic-engineering.coder", "agentic-engineering.guidance-reviewer", "agentic-engineering.guidance-writer", "agentic-engineering.integrator", "agentic-engineering.orchestrator", "agentic-engineering.pdo", "agentic-engineering.product-owner", "agentic-engineering.recon", "agentic-engineering.reviewer-code", "agentic-engineering.reviewer-spec", "agentic-engineering.spec-writer", "agentic-engineering.team-planner"]
events = ["work_item_observation"]
english = "Owning bundle: agentic-engineering. Organization policy context: recipient archetypes do not change election. On an assignment close, if its work item remains open with no open assignments, immediately ask the active recorded delivery owner, falling back to the personal owner, to close the item, card more work or fail it. After actual delivery of its current saved slate wake, admit the next reminder after the configured triage interval (one day by default), while the item is open with no open assignments. Pending or failed delivery never rearms it. Assignment transitions and terminal disposition withdraw it through the cancellation rail."
when = { op = "and", args = [{ op = "and", args = [{ op = "eq", args = [{ ref = "facts.work_item.state" }, "open"] }, { op = "or", args = [{ op = "eq", args = [{ ref = "facts.work_item.slateWakeId" }, { ref = "event.after.slateWakeId" }] }, { op = "eq", args = [{ ref = "facts.work_item.slateWakeId" }, { ref = "wake_id" }] }] }, { op = "or", args = [{ op = "in", args = [{ ref = "event.operation" }, ["assignment_closed"]] }, { op = "and", args = [{ op = "eq", args = [{ ref = "event.operation" }, "delivered"] }, { op = "eq", args = [{ ref = "event.before.deliveredWakeId" }, { ref = "event.after.slateWakeId" }] }, { op = "not", args = [{ op = "is_null", args = [{ ref = "event.after.slateWakeId" }] }] }] }] }] }, { op = "eq", args = [{ ref = "facts.open_assignment_count" }, 0] }] }
bind = [{ name = "wake_id", value = { op = "concat", args = ["w_reaction_", { op = "sha256", args = [{ op = "json", args = [[{ ref = "event.id" }, "r05", "notice"]] }] }] } }, { name = "recipient", value = { op = "if", args = [{ op = "gt", args = [{ op = "count", args = [{ op = "filter", items = { ref = "facts.sessions" }, as = "session", where = { op = "and", args = [{ op = "eq", args = [{ ref = "session.sessionKey" }, { ref = "facts.work_item.deliveryOwnerSessionKey" }] }, { op = "eq", args = [{ ref = "session.state" }, "active"] }] } }] }, 0] }, { ref = "facts.work_item.deliveryOwnerSessionKey" }, { ref = "facts.personal_session_key" }] } }, { name = "interval", value = { op = "coalesce", args = [{ ref = "facts.configured_triage_deadline_ms" }, 86400000] } }]
[[reaction.effects]]
slot = "notice"
kind = "notice"
when = true
value = { wake_id = { ref = "wake_id" }, session_key = { ref = "recipient" }, owner_user_id = { ref = "event.org" }, origin = "process:tightbeam", template = "work-item-slate", arguments = { work_item_id = { ref = "event.workItemId" }, title = { ref = "facts.work_item.title" } }, due_at = { op = "add", args = [{ op = "coalesce", args = [{ ref = "event.scheduleBaseAt" }, { ref = "event.at" }] }, { op = "if", args = [{ op = "eq", args = [{ ref = "event.operation" }, "delivered"] }, { ref = "interval" }, 0] }] }, work_item_id = { ref = "event.workItemId" }, sender_scheduled = true, on_unavailable = "schedule", reference = { resource = "work_item", id = { ref = "event.workItemId" }, field = "slateWakeId", expected = { ref = "event.after.slateWakeId" } } }

